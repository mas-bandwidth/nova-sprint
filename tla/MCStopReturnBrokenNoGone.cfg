\* MCStopReturn (StopReturn.tla): two cards, two owners, generations to 4;
\* Broken = "nogone". The code before 2026-10-23: a debt whose card has no
\* record in the epoch (Vanish: it left with a cleared epoch) stays owned, and
\* nothing can return a card with no record, so START refuses for good
\* (GoneNeverBlocksStart fails).
SPECIFICATION Spec
CONSTANTS
    Cards = {c1, c2}
    Owners = {o1, o2}
    Readers = {}
    MaxGen = 4
    Broken = "nogone"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    GoneNeverBlocksStart
