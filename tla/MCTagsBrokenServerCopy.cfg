\* Reversed witness: Eligible reads a copy written only by Sync, a weakly fair action not
\* tied to ConfigApply. A card is placed on a machine whose config row no longer names its
\* tag. NeverPlacedWithoutTags fails.
SPECIFICATION Spec
CONSTANTS
  Machines = {"win", "lin", "mac"}
  Tags = {"windows", "linux", "tla", "fuzz"}
  Probed = {"tla"}
  Cards = {"gen", "win", "probed", "later"}
  Need <- MCNeed
  Paths = {"deal", "route", "next", "redo", "downredeal", "level", "rebalance", "friend", "take", "read"}
  Broken = "servercopy"
  MovePath = "next"
  Rows <- MCRows
  Capable <- MCCapable
  Gates <- MCGates
  Registry0 <- MCRegistry0
  Declared0 <- MCDeclared0
INVARIANTS NeverPlacedWithoutTags
CHECK_DEADLOCK FALSE
