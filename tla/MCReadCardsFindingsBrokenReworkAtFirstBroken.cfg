\* Reversed witness: the rule reworks at the first broken read while the second is still
\* working, retiring it. The next attempt's work starts, and only then does the second
\* reader report: its finding is kept as a late read, but it missed the brief of the attempt
\* it was for, and the machine made it late. TLC must find that finding.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreSpent = FALSE
  Need = 2
  Live = FALSE
  BugNamesHeld = FALSE
  BugNoLiveReturn = FALSE
  Findings = TRUE
  BugDropLate = FALSE
  BugReworkAtFirstBroken = TRUE
  BugWidenAtFirstBroken = FALSE
  BugLateMissesRunning = FALSE
INVARIANTS TypeOK NoFindingLost
