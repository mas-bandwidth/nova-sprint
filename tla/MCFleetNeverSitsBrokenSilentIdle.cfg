\* Reversed witness "silentidle": NameCause is disabled, so a ready card in
\* front of a free up member reaches the tick past D with no named cause.
\* IdleHasCause must fail.
SPECIFICATION Spec
CONSTANTS
  Cards <- MCCards
  Members <- MCMembers
  Readers <- MCReaders
  Routes <- MCRoutes
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {"silentidle"}
INVARIANTS IdleHasCause
