\* Reversed witness: repair abandons an aged operation without sending its first
\* manifest itself (engine.go finishOp's send at i == 0 dropped), with a writer slower
\* than the grace. TLC must find the late writer applying a manifest of an abandoned
\* operation.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = FALSE
  Broken = "repairnosend"
  None = None
INVARIANTS TypeOK AbandonedAppliedNothing
