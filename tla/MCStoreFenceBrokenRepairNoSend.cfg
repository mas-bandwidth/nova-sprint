\* Reversed witness: repair abandons without sending the pending operation's first
\* manifest itself (engine.go finishOp's send at :2217 dropped). TLC must find the
\* operation's live writer applying it after the abandonment.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = FALSE
  Broken = "repairnosend"
  Nonce = TRUE
  None = None
INVARIANTS TypeOK AbandonedAppliedNothing
