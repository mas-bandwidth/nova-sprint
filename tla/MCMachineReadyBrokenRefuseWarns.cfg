\* MCMachineReady (MachineReady.tla); Broken = "refusewarns": a refusing finding is taken as a warning, so a clean record holds refusing cards (CleanRecordHasNoDefect fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "refusewarns"
INVARIANTS
    CleanRecordHasNoDefect
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    StartOnlyChecked
    UncheckedStartWarns
    StartNeverGatedByCheck
    WarnsNeverFail
    WarnOnlyStarts
