\* REVERSED WITNESS of VerbFence.tla: the retry without the own check. The
\* old card is dealt between the read and the commit, and the op planned
\* again commits on the changed old card. OwnKept must be violated.
CONSTANTS
  Tries = 4
  MaxEnv = 3
  Coarse = FALSE
  Writers = {"old"}
  OwnCheck = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT OwnKept
