\* The reversed witness "restartack": the code at 10aca665, whose owed close is held in
\* the loop's memory only. The seat acks the cause, a pass clears it, the close is not
\* written, the server restarts (the owed close lost with its memory), and the same cause
\* comes back on the new server, whose first raise reads the stale acknowledgement as
\* said and writes nothing (PR 189 read 5), a counterexample to StaleSilent; the run is
\* expected to fail naming that property (listed first).
