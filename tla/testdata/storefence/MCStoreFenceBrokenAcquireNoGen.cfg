\* Reversed witness: Acquire without the generation check (redis.go Acquire's g != gen
\* test dropped, :692). TLC must find a plan made before another writer's commit of the
\* same caller operation acquiring and committing it again.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = TRUE
  Broken = "acquirenogen"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK CallerCommitsOnce
