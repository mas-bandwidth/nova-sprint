\* Reversed witness: v1.4.5 (f4a0d6a1), a fleet reader whose cell names a tier
\* is asked its reads regardless of routes, so rx1 and rx2 are asked the frontier read
\* with no frontier route. TLC must fail NoReadOnUnroutedTier.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = TRUE
  BugReadsRegardlessOfRoutes = TRUE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  Need <- MCNeed
INVARIANTS NoReadOnUnroutedTier
