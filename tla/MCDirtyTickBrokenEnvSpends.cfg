 Streams = {"s1", "s2"}
 Cards = {"c1"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1"}
 Width <- MCWidth
 MOrder <- MCMOrder
 Readers = {"r1"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 1
 MaxRedeals = 1
 Takes = TRUE
 Coord = FALSE
 MaxActs = 2
 MaxSub = 12
 CtrMod = 2
 Addable = {}
 Scn <- ScnEnv
 Fixes = {"seefleet", "pendingroom"}
 Broken = "envspends"
INVARIANTS TypeOK
PROPERTIES EnvDeathSpendsNoRedeal
