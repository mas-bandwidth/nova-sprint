\* control: width 2, two cards, two machines, two readers, the whole life with
\* the "consumersout" fix (the settle loop re-pumps the work table): a finish
\* and a lapse each leave no producer card without its consumer at the tick's
\* end.
SPECIFICATION Spec
CONSTANTS
 Streams = {"s1", "s2"}
 Cards = {"c1", "c2"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1", "m2"}
 Width <- MCWidth2
 DealAhead <- MCDealAhead
 MOrder <- MCMOrder
 Readers = {"r1", "r2"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 2
 MaxRedeals = 1
 Takes = FALSE
 Coord = FALSE
 MaxActs = 1
 MaxSub = 32
 CtrMod = 2
 Addable = {}
 Scn <- ScnBase
 Fixes = {"seefleet", "pendingroom", "consumersout"}
 Broken = "none"
INVARIANTS TypeOK NothingLost OneWakePerTick HoldRespected RedealsAreEndedTakes RedealsBounded CIIsItsHeads
PROPERTIES ConsumersOut SettleBoundJudged
