\* MCServerSwitch.cfg and MCServerSwitchLiveFull.cfg are bench cases (group
\* serverswitch-full, gate bench, the runner's manual mode); this case and
\* MCServerSwitchLive.cfg keep the safety and the liveness in the routine group.
