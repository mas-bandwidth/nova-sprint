\* The code without the timing assumption: a live writer may be slower than the grace.
\* A manifest carries no check of the fence (engine.go Store.apply), so a writer can
\* send after repair abandoned its operation. Every invariant still holds: repair sends
\* the first manifest itself (engine.go finishOp) and abandons only one the store refuses,
\* which refuses the late writer's send the same way.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = FALSE
  Broken = "none"
  None = None
INVARIANTS TypeOK CommittedWhole NoPartialOutsideFence NoApplyWithoutCommit AbandonedAppliedNothing OkMeansCommitted ReplayMatches CallerCommitsOnce FenceOneHolder
