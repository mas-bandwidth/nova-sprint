\* The code without the timing assumption: a live writer may be slower than the grace.
\* A manifest carries no check of the fence (engine.go Store.apply), so a writer whose
\* operation repair abandoned past the grace can still apply its first manifest when
\* nothing else wrote the table, and its release then finds the fence empty, writes
\* nothing and returns success. Expected to break AbandonedAppliedNothing: the hole this
\* model found (2026-10-27), held as a case that fails until a fix closes it.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  Timely = FALSE
  Broken = "none"
  None = None
INVARIANTS TypeOK AbandonedAppliedNothing
