\* The design without the timing assumption: a live writer may be slower than the grace.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = FALSE
  Broken = "none"
  None = None
INVARIANTS TypeOK NoMixedOp CommittedWhole NoPartialOutsideFence NoApplyWithoutCommit AbandonedAppliedNothing OkMeansCommitted ReplayMatches CallerCommitsOnce
