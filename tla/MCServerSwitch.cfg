\* The design: two switches at most, a rollback window of two, a clock to four,
\* a land that is ok, refused or failed, and a crash between the copy and the
\* state write. The target is always a known binary, a rollback happens only in
\* the window, and each switch rolls back at most once.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary
