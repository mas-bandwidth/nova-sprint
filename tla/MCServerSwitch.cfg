\* The design: two switches at most, a rollback window of two, a clock to four,
\* a land that is ok, refused or failed, a crash between the copy and the
\* state write, and a restart that drops the seat's hook, with a hand land the hook
\* gate refuses before it acts (the automatic pass runs whatever the hook). The target
\* is always a known binary, a rollback happens only in the window, each switch rolls
\* back at most once, and a land the hook gate refused never rolls a switch back.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal
