\* MCMachineReady (MachineReady.tla); Broken = "nostopstamp": a stop of a RUNNING
\* machine leaves its stamp; a start inside a clear, stopped after the advance,
\* reads READY though it ran (RanIsNotReady fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "nostopstamp"
INVARIANTS
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    StartOnlyChecked
    UncheckedStartWarns
    StartNeverGatedByCheck
    CleanRecordHasNoDefect
    WarnsNeverFail
    WarnOnlyStarts
