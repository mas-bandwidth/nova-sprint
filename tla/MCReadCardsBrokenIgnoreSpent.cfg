\* Reversed witness: the spent reader is forgotten, so a reader that returned a
\* read of the attempt is dealt it again (deal gen 0, return, deal gen 1). TLC
\* must find the second card of the attempt after a spent one.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreSpent = TRUE
  Need = 1
  Live = FALSE
  BugNamesHeld = FALSE
  BugNoLiveReturn = FALSE
INVARIANTS TypeOK NeverTwiceAfterSpent
