\* The design: entries deduped by card, a record of another epoch is empty, an older build
\* refuses layout_newer and writes nothing over a newer record. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  BugNoOriginGuard = FALSE
  BugNoDedup = FALSE
  BugKeepEpoch = FALSE
  BugOverwriteNewer = FALSE
INVARIANTS ReviewObservedOnOrigin OlderBuildNeverWritesNewerLayout TypeOK NoDoubleCount CaughtUpIsTruth ResetShowsZero ClearStartsAgain
