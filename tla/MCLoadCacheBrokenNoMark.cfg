\* reversed witness: the serve-time mark check dropped (loadcache.go catchUpCached,
\* `if !ok || fromMark != ct.mark`, loadcache.go:154, which Take's MarkAt check models):
\* a store that lost its last writes and wrote others to or past the cached revision
\* gives the cache's lost history as its own. First violating state: after a Display
\* (rev 0 -> 1, mark 1) l1 reads whole and keeps the entry (crev = 1, cmark = 1), l2
\* begins at rev 1, a Rollback to rev 0 empties the stream, then l2's Take serves the
\* cache's records (MarkAt(1) = NoEvent # cmark 1, unchecked) and good[l2][a] = FALSE:
\* HasAt(1) is false because hist = <<ZeroT>>. In the code, the rollback leaves no event
\* that left revision 1, so fromMark # ct.mark and the entry is dropped, not served.
SPECIFICATION Spec
