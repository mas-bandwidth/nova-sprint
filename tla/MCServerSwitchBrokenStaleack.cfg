\* The reversed witness "staleack": a cause the seat acked clears, the clear's close of
\* its judgment and acknowledgement does not land at once, and the same cause comes back
\* before it does; the raise finds the stale acknowledgement of its key and writes
\* nothing (PR 189 read 4), a counterexample to NoStaleAck; the run is expected to fail
\* naming that property (listed first).
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"staleack"}
INVARIANTS
 NoStaleAck TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
