\* The reversed witness "staleack": a cause the seat acked clears, the clear's close of
\* its judgment and acknowledgement does not land at once, and the same cause comes back
\* before it does; the raise finds the stale acknowledgement of its key and writes
\* nothing (PR 189 read 4), a counterexample to StaleSilent; the run is expected to fail
\* naming that property (listed first). The trace is the intended one: ack, clear, the
\* same cause back behind the owed close. A fresh ack of a judgment raised in the new
\* episode is no counterexample (StaleSilent's raisedFor; PR 189 read 5).
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"staleack"}
INVARIANTS
 StaleSilent TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
