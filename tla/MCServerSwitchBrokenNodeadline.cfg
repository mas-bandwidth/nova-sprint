\* The reversed witness "nodeadline": the deadline check of
\* CheckRollbackOnLandFailure is skipped, so a land fault past the window still
\* rolls back, a counterexample to RollbackOnlyInWindow; the run is expected to
\* fail naming that property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"nodeadline"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary
