\* Reversed witness: the rework's first read asked of any reader with room
\* (the ask without the finder-first guard). Three readers, so a card needing
\* two can skip its finder while the finder still has room. TLC must find a
\* first read not asked of the finder while it had room.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Rule = "parallel"
 Broken = "nofinder"
INVARIANTS TypeOK FinderFirst
