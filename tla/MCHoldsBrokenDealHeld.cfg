\* MCHolds (Holds.tla): the deal's ready closure drops the held check
\* (steps_work.go dealPlan), and NeedsSet drops it too, which is the only way a
\* held card reaches ready for the deal to see: the held card is dealt, and
\* NoHeldCardDealt fails. HeldMovesOnlyByRelease is left off the list, since the
\* needs set breaks it a step earlier; the deal's guard is the second of two.
SPECIFICATION Spec
CONSTANTS
    Broken = "none"
    CardBroken = {"needssetheld", "dealheld"}
INVARIANTS
    TypeOK
    NoHeldCardDealt
