\* The design of 2026-10-04: one read at a time, the finder first, every read
\* on a reader with room. The sequential invariants (OneAtATime, OneBroken,
\* the sequential ReadsPerLanding of Need + broken attempts) and the liveness
\* hold.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Rule = "sequential"
 Broken = "none"
INVARIANTS TypeOK WidthRespected OneAtATime OneBroken ReadsPerLanding FinderFirst NoAskWhileBroken
PROPERTIES Settles
