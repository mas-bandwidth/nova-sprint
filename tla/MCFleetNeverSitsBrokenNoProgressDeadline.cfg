\* Reversed witness "noprogressdeadline": ProgressDeadline is disabled, so the
\* route that stops answering (Stall: ultramarine) holds its run and its slot
\* forever. RunProgress must fail.
SPECIFICATION Spec
CONSTANTS
  Cards <- MCCards
  Members <- MCMembers
  Readers <- MCReaders
  Routes <- MCRoutes
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {"noprogressdeadline"}
INVARIANTS NoRunWithoutProgressPastT
PROPERTIES RunProgress
