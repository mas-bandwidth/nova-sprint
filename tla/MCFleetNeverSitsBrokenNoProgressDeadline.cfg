\* Reversed witness "noprogressdeadline": ProgressDeadline is disabled, so the
\* route that stops answering (Stall: ultramarine) holds its run and its slot
\* forever. RunProgress must fail. The two-card, one-member instance also checks
\* NoAwayReaderHolds: the second card is still read-less when ReaderDeadline
\* sets a reader away, so its Deal must choose a live reader.
SPECIFICATION Spec
CONSTANTS
  Cards <- MCCards
  Members <- MCMembersOne
  Readers <- MCReaders
  Routes <- MCRoutesOne
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {"noprogressdeadline"}
INVARIANTS NoRunWithoutProgressPastT NoAwayReaderHolds
PROPERTIES RunProgress
