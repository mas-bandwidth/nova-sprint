\* MCMachineReady (MachineReady.tla); Broken = "clearkeeps": start reads the cleared epoch's record as this epoch's, so a start with no record after a clear passes (StartOnlyChecked fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "clearkeeps"
INVARIANTS
    StartOnlyChecked
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    CleanRecordHasNoDefect
