\* MCMachineReady (MachineReady.tla); Broken = "rerunadvance": a clear run again over a crashed one advances again,
\* carrying from the empty epoch (CarrySurvives fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "rerunadvance"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
INVARIANTS
    CarrySurvives
    DefaultsAfterClear
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    SetSurvives
    NeverAbsent
    ReadersSeeWorking
