\* The reversed witness "ackcloses": the seat's ack closes the judgment and keeps no
\* acknowledgement (steps_ack.go before PR 189's read 3), so the next beat's re-check
\* raises the same cause again while it stands, a counterexample to AckSticks; the
\* run is expected to fail naming that property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"ackcloses"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
