\* MCMachineReady (MachineReady.tla): three clears, each a stop, an advance and its set-defaults step, with starts and sets between; every invariant holds.
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "none"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
INVARIANTS
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
