\* MCMachineReady (MachineReady.tla): three clears, each a stop and an advance with starts between; every invariant holds.
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "none"
INVARIANTS
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    StartOnlyChecked
    CleanRecordHasNoDefect
