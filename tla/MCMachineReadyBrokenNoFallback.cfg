\* MCMachineReady (MachineReady.tla); Broken = "nofallback": a reader reads a cleared epoch's absent setting as absent
\* (ReadersSeeWorking fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "nofallback"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    ReadersSeeWorking
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    SetSurvives
    NeverAbsent
