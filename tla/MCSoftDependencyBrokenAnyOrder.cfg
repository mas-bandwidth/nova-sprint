\* MCSoftDependencyBrokenAnyOrder (SoftDependency.tla); Broken = "anyorder": LandBatch takes queued heads ignoring soft dependencies, so b lands while a is queued and held, and SoftLandsInOrder fails.
SPECIFICATION Spec
CONSTANTS
    Broken = "anyorder"
INVARIANTS
    SoftLandsInOrder
    TypeOK
    SoftNeverBlocksDeal
    SoftIsOrderOnly
    HeldNeverEmptiesBatch
    DropReleasesSoft
    NoSoftAndNeedCycle
