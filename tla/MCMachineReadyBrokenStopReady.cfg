\* MCMachineReady (MachineReady.tla); Broken = "stopready": a stop accepted on
\* a READY machine (StoppedOnlyFromRunning fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "stopready"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    StoppedOnlyFromRunning
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
