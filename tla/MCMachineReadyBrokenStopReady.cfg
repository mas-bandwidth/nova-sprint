\* MCMachineReady (MachineReady.tla); Broken = "stopready": a stop accepted on
\* a READY machine (StoppedOnlyFromRunning fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "stopready"
INVARIANTS
    StoppedOnlyFromRunning
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    StartOnlyChecked
    CleanRecordHasNoDefect
