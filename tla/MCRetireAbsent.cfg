\* The design: the tick retires an empty fleet row whose machine record is gone
\* from the inventory, and acts on no failed config read. FleetRowsMatchConfig
\* and RowsHaveRecords hold, and every absent record's row is retired (LiveRetire).
SPECIFICATION Spec
CONSTANTS
 Members = {m1, m2, m3}
 BrokenRead = FALSE
INVARIANTS
 FleetRowsMatchConfig
 RowsHaveRecords
PROPERTIES
 LiveRetire
