\* The design: the tick retires an empty fleet row whose machine record is gone
\* from the inventory, and acts on no failed config read. RecordsKeepRows holds
\* in every state; FleetRowsMatchConfig and LiveRetire are the leads-to that the
\* tick's fair reads and retirement make true, and every absent record's row is
\* retired.
SPECIFICATION Spec
CONSTANTS
 Members = {m1, m2, m3}
 BrokenRead = FALSE
INVARIANTS
 RecordsKeepRows
PROPERTIES
 FleetRowsMatchConfig
 LiveRetire
