\* MCStopReturn (StopReturn.tla): two cards, two owners, generations to 4;
\* Broken = "goneblocks". The code before 2026-10-18: START reads only the
\* placed cells, so a card the STOPPED reconcile returned off the table, its
\* receipt on the kept record, stays owned and holds START refused with
\* nothing able to settle it (GoneNeverBlocksStart fails). NoStaleGenOwned is
\* left out: the same defect fails it one step earlier (the gone card, owned,
\* is at the receipt's newer generation), and this witness is for the START.
SPECIFICATION Spec
CONSTANTS
    Cards = {c1, c2}
    Owners = {o1, o2}
    Readers = {}
    MaxGen = 4
    Broken = "goneblocks"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    GoneNeverBlocksStart
