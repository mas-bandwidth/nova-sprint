\* MCHolds (Holds.tla): NeedsSet recomputes the column from the new needs and
\* drops the held check (steps_edit.go NeedsSet), so a held waiting card whose
\* needs have landed moves to ready with its hold kept: HeldMovesOnlyByRelease
\* fails.
SPECIFICATION Spec
CONSTANTS
    Broken = "none"
    CardBroken = {"needssetheld"}
INVARIANTS
    TypeOK
    HeldMovesOnlyByRelease
