\* MCHolds (Holds.tla): a stop raises no judgment (silent), so a stopped stream
\* has no open judgment and is not held: NoSilentStall fails. Broken =
\* "silentstop".
SPECIFICATION Spec
CONSTANTS
    Broken = "silentstop"
INVARIANTS
    TypeOK
    NoSilentStall
PROPERTIES
    HeldStreamDealsNothing
    CrossResumesAfterNeed
    OwnRefusalNeverStops
