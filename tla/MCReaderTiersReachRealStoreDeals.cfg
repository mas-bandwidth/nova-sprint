\* Reachability witness: a real store that starts with no route deals the flash
\* work card once a flash route is enabled. TLC must fail
\* ReachRealStoreDealsOnceRouted.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = FALSE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  StoreKind = "real"
  BugShortcutOnRealStore = FALSE
  Need <- MCNeed
INVARIANTS ReachRealStoreDealsOnceRouted
