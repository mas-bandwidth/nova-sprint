\* Reversed witness: the row deletes do not check the operation the fence holds
\* (Release drops RestoreGuard.Owner). TLC must find a delete by a late remover
\* whose operation the fence no longer holds.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1}
  Arg = {a1}
  Manifests = 1
  MaxTries = 1
  MaxEpoch = 1
  MaxStray = 1
  Timely = TRUE
  Broken = "rowdelanyowner"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK RowDelHeldFence
