\* The parallel rule asks a card's reads together: TLC must find a card with
\* two reads outstanding, where the sequential design's OneAtATime (one read
\* at a time) fails.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Rule = "parallel"
 Broken = "none"
INVARIANTS TypeOK WidthRespected OneAtATime
