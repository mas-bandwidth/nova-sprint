\* MCMachineReady (MachineReady.tla); Broken = "overrefuse": start refuses a non-working
\* value a set of this epoch chose, so the owner's deliberate degraded run cannot start
\* (DeliberateSetStarts fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "overrefuse"
INVARIANTS
    DeliberateSetStarts
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
