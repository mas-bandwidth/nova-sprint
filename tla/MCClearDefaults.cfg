\* MCClearDefaults (ClearDefaults.tla): two clears at once over two epochs, one member/reader row, starts, sets,
\* edits and removals between them; every invariant holds. The clears are symmetric (SYMMETRY ProcPerms).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 2
    Broken = "none"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
    Rows = {"r1"}
    Procs = {a, b}
SYMMETRY ProcPerms
INVARIANTS
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
    FinishOnlyWhatIsOwed
    MembersRestored
    EpochZeroNeverOwed
    RerunKeepsEpochWrites
    NeverRunningWhileRestorePending
