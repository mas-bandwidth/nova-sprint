\* MCMachineReady (MachineReady.tla); Broken = "failedrecord": start takes a failed check record of the cards now (StartOnlyChecked fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "failedrecord"
INVARIANTS
    StartOnlyChecked
    UncheckedStartWarns
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    CleanRecordHasNoDefect
    WarnsNeverFail
    WarnOnlyStarts
