\* MCMachineReady (MachineReady.tla); Broken = "readersgate": start refuses while no
\* reader is up, so the fleet's live state blocks a start the settings allow
\* (DeliberateSetStarts fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "readersgate"
INVARIANTS
    DeliberateSetStarts
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    StartOnlyChecked
    CleanRecordHasNoDefect
