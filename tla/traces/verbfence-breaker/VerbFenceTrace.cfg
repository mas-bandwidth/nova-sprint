\* The code without the own check (tla/VerbFenceNoOwn.cfg): the old card is dealt
\* between the read and the commit, and the re-read plans again; refused at 5.
\* expect: forbidden at 5
CONSTANTS
  Tries = 5
  MaxEnv = 4
  Coarse = FALSE
  Writers = {"deal", "land", "hold", "old", "touch"}
  OwnCheck = TRUE
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  Follows
  NoOrphan
  TargetLive
  OwnKept
  NeverStuck
PROPERTY TraceMatched
