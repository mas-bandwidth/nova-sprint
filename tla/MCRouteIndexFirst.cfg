 Broken = "none"
 Members = {"m1", "m2"}
 MemberUnlaunch <- MCMemberUnlaunch
 BenchOf <- MCBenchOf
 Refused <- MCRefused
 First = {"a", "d"}
 BenchedCards = {}
 RefusedCards = {}
SYMMETRY MCSym
INVARIANTS TypeOK RouteIndexAdvancesOncePerCard ExcludedNeverDrawn NeverUnlaunchable FirstPreferred StrandedIsJudged
PROPERTIES PinNeverAdvances
