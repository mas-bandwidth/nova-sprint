\* Reversed witness "redealsame": StartDeadline may redeal the card to the same
\* member, even a deaf one, while another live member could take it. Under
\* MemberDeaf the card never starts. WorkStarts must fail.
SPECIFICATION Spec
CONSTANTS
  Cards <- MCSmallCards
  Members <- MCMembers
  Readers <- MCReaders
  Routes <- MCRoutes
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {"redealsame"}
INVARIANTS NoDealtPastT
PROPERTIES WorkStarts
