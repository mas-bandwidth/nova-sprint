\* control: a base takes a recorded forward-merge while two cards wait; each is
\* marked pending and the accept refuses it until the coordinator rechecks it
\* (NoDealAgainstStaleTip).
SPECIFICATION Spec
CONSTANTS
 Cards = {c1, c2}
 Sentinels = {}
 HeldCards = {}
 MaxAttempts = 2
 MaxEpoch = 0
 MaxEvents = 4
 ForwardMergeOn <- MCFMOn
 Broken = "none"
INVARIANTS TypeOK NoDealAgainstStaleTip
