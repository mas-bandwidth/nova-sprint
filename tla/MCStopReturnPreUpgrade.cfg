\* MCStopReturn (StopReturn.tla): one card, two owners, generations to 4;
\* Broken = "preupgrade". A pre-upgrade STOP writes no durable stop-issued
\* flag and no debt list, so START refuses while a live lease remains.
SPECIFICATION Spec
CONSTANTS
    Cards = {c1}
    Owners = {o1, o2}
    Readers = {}
    MaxGen = 4
    Broken = "preupgrade"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    NoStaleGenOwned
