\* The design's liveness at the safety config's full bounds (the clock to 4, as
\* MCServerSwitch.cfg): LandingNeverWaitsOnTheHook and RefusalIsReported under FairSpec,
\* with every safety invariant. MCServerSwitchLive.cfg bounds the clock at 3 to fit the
\* runner's 110 s per-case budget; that bound drops a past-the-deadline fault after a
\* switch at clock 1 or later, a second permanent switch, and a close owed across a Tick
\* followed by a deadline (PR 189 read 5). This case keeps them. It is a bench case
\* (gate bench in CASES.tsv): it runs past the routine budget, so it is run by hand on a
\* Linux bench with the runner's manual mode, `make tlc-full TLC_GROUP=serverswitch-full
\* TLC_BUDGET=3600 ...` (tlacheck run --manual), and its record is merged as any other.
