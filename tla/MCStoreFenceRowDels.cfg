\* The fence with an operation's row deletes durable in its record: a crash before
\* the commit leaves the fence holding the rows, Repair takes them off, and no row
\* is deleted by a writer the fence no longer holds.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1}
  Arg = {a1}
  Manifests = 1
  MaxTries = 1
  MaxEpoch = 1
  MaxStray = 1
  Timely = TRUE
  Broken = "none"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK NoMixedOp CommittedWhole NoPartialOutsideFence NoApplyWithoutCommit AbandonedAppliedNothing RowDelHeldFence CommittedRowsGone OkMeansCommitted ReplayMatches CallerCommitsOnce
