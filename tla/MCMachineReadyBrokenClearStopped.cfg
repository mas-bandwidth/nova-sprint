\* MCMachineReady (MachineReady.tla); Broken = "clearstopped": a clear that
\* leaves STOPPED (ClearLeavesReady fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "clearstopped"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    ClearLeavesReady
    TypeOK
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
