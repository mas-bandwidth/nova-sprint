\* reversed witness: a forward-merge marks the waiting cards stale, and the
\* accept deals one without the recheck; NoDealAgainstStaleTip must fail
\* (ForwardMerge, Accept c2).
SPECIFICATION Spec
CONSTANTS
 Cards = {c1, c2}
 Sentinels = {}
 HeldCards = {}
 MaxAttempts = 2
 MaxEpoch = 0
 MaxEvents = 4
 ForwardMergeOn <- MCFMOn
 Broken = "staletip"
INVARIANTS TypeOK NoDealAgainstStaleTip
