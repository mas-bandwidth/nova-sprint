\* MCClearDefaults (ClearDefaults.tla); Broken = "restorerepeat": a clear run again ignores the restore's marker and
\* writes the readers' tiers unconditionally, as 02af0680 did: a tier set or a row removed after the restore is
\* restored again (RerunKeepsEpochWrites fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "restorerepeat"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
    Rows = {"r1", "r2"}
INVARIANTS
    RerunKeepsEpochWrites
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
    FinishOnlyWhatIsOwed
    MembersRestored
    EpochZeroNeverOwed
