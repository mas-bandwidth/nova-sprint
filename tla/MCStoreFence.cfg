\* The design with the proposed fix (Nonce = TRUE: an operation id carries its writer's
\* nonce), refusals that stay refused (Revive = FALSE), writers that finish within the
\* grace or die. The holes outside it: MCStoreFenceSharedOpIds.cfg (the code without the
\* nonce) and MCStoreFenceRevivedRefusal.cfg (a refusal a later write undoes).
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = TRUE
  Broken = "none"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK NoMixedOp CommittedWhole NoPartialOutsideFence NoApplyWithoutCommit AbandonedAppliedNothing OkMeansCommitted ReplayMatches CallerCommitsOnce
