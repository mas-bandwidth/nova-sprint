\* to no machine and no friend until unhold, c2 lives its life
SPECIFICATION Spec
CONSTANTS
 Streams = {"s1", "s2"}
 Cards = {"c1", "c2"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1", "m2"}
 Width <- MCWidth
 MOrder <- MCMOrder
 Readers = {"r1", "r2"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 2
 MaxRedeals = 1
 Takes = TRUE
 Coord = FALSE
 MaxActs = 1
 MaxSub = 12
 CtrMod = 2
 ReadCost = "half"
 Addable = {}
 Scn <- ScnHeldStream
 Fixes = {"seefleet", "pendingroom"}
 Broken = "none"
INVARIANTS TypeOK HeldStreamNotDealt WorkPumpedOnce NothingLost OneWakePerTick WidthRespected TickBounded RedealsAreEndedTakes RedealsBounded CIIsItsHeads
PROPERTIES WorkChangesOnlyInPump WorkAdvancesOnlyInThePump WorkPumpedEveryTick QueueDrainedByPump WorkQueueDrainedOnlyByPump ThreeQueuesEmptyAtTickEnd EveryRowWithWorkMoves NoWakeIfNothing PlacementsRound StreamFairness AcceptHolds RedealBoundHolds
