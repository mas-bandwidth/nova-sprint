\* The reversed witness "keepstate": the state is kept after a rollback, so a
\* second land fault in the same window rolls back again, a counterexample to
\* AtMostOneAutoRollbackPerSwitch; the run is expected to fail naming that
\* property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"keepstate"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary
