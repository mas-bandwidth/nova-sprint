\* control: the design; 3 cards of up to 2 attempts, epochs 0..1, 4 outside events.
\* c1 is a sentinel (never queued: released to landed), c2 a card a change is
\* queued for (repair leaves it alone), so the guards are not constant-TRUE.
SPECIFICATION Spec
CONSTANTS
 Cards = {c1, c2, c3}
 MaxAttempts = 2
 MaxEpoch = 1
 MaxEvents = 4
 Sentinels = {c1}
 HeldCards = {c2}
 Broken = "none"
INVARIANTS TypeOK LandedInBase CallerEpochCheckedBeforePush ReportHoldsTheEpoch NeverStoppedByOwn CarriedHead NoLandWithoutReads NoOfferAtRefusedHead NoSentinelInQueue
PROPERTIES LandsInOrder LeavesMergeRightly PushedNeverSentBack NeverHeldBack
