\* MCStopReturn (StopReturn.tla): two cards, two owners, generations to 4; Broken = "byid".
\* A lease owns its card by id, so a card returned (redealt) at gen+1 is still
\* owned by the lease captured at gen (NoStaleGenOwned fails).
SPECIFICATION Spec
CONSTANTS
    Cards = {c1, c2}
    Owners = {o1, o2}
    Readers = {}
    MaxGen = 4
    Broken = "byid"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    NoStaleGenOwned
