\* MCStopReturn (StopReturn.tla): two cards, two owners, generations to 4;
\* Broken = "none". ClearEnabled and ClearNeverWithALiveLease check clear's
\* reachability and safety: from RUNNING clear stops first, and with no live
\* work/read lease it advances to the blank epoch.
SPECIFICATION Spec
CONSTANTS
    Cards = {c1, c2}
    Owners = {o1, o2}
    Readers = {}
    MaxGen = 4
    Broken = "none"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    NoStaleGenOwned
    GoneNeverBlocksStart
    ClearNeverWithALiveLease
    ClearEnabled
PROPERTIES
    ReturnedFreesItsRow
    AbsentJobSettles
