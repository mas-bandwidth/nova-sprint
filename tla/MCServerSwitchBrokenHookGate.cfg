\* The reversed witness "hookgate": the old gate, under which the automatic land pass
\* waits while the seat is unhooked, so an accepted card with the seat unhooked and the
\* server running is never landed nor refused for a reason other than the hook, a
\* counterexample to LandingNeverWaitsOnTheHook; the run is expected to fail naming that
\* property.
SPECIFICATION FairSpec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"hookgate"}
INVARIANTS
 TypeOK
PROPERTIES
 LandingNeverWaitsOnTheHook
