\* The reversed witness "partialrefusal": a pass whose batches landed or were refused
\* one by one (land exits 1 when any batch was refused) is read as a standing refusal,
\* as PR 189's first cut did (its reason the pass's first line, a LAND OK), a
\* counterexample to RefusalOnlyWhenNothingCouldLand; the run is expected to fail
\* naming that property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"partialrefusal"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
