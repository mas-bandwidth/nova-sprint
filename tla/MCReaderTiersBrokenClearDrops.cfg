\* Reversed witness: Clear drops the member reader rows, so an up member
\* is no reader after it. TLC must fail EveryUpMemberIsAReader.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = TRUE
  BugClearTurnsOff = FALSE
  RoutesExist = TRUE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  StoreKind = "real"
  BugShortcutOnRealStore = FALSE
  Need <- MCNeed
INVARIANTS EveryUpMemberIsAReader
