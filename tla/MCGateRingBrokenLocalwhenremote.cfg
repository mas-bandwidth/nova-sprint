\* reversed witness: the fallback runs the gate in the clone even when another
\* member is configured (the `if remote` guard dropped), so a gate no bench ran is
\* run here instead of refused (NoLocalGoWhenRemote fails)
SPECIFICATION Spec
CONSTANTS
 Hosts = {"h1", "h2"}
 Ring <- MCRing
 SkipAfter = 2
 Gates = 3
 Passes = 2
 Remote = TRUE
 Broken = "localwhenremote"
INVARIANTS NoLocalGoWhenRemote
