\* reversed witness: the keep's revision guard dropped, so the cache regresses.
\* It does not break LoadIsSnapshot: the serve-time mark check (Broken = "nomark"
\* drops it) is the correctness guard; the revision guard only keeps the newest
\* read, an efficiency. The witness fails CacheNotRegressed instead.
SPECIFICATION Spec
CONSTANTS
 Tables = {"a"}
 Keys = {"k1", "k2"}
 Vals = {0, 1}
 Loaders = {"l1", "l2"}
 MaxW = 2
 MaxLoads = 2
 MaxRollbacks = 1
 MaxClear = 1
 Broken = "norevguard"
INVARIANT TypeOK
INVARIANT LoadIsSnapshot
INVARIANT LoadIsOfItsEpoch
INVARIANT CacheIsHistory
INVARIANT CacheNotRegressed
