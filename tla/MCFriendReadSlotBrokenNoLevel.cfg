\* Reversed witness: the tick never levels an untaken read (the deal bound alone took it back,
\* hours later). TLC must find a tick that leaves a read past the bound while another reader
\* had a free slot.
SPECIFICATION Spec
CONSTANTS
  Reads = {p1, p2}
  Bound = 1
  BadDeal = "none"
  BadLevel = TRUE
  BadGive = "none"
PROPERTIES LevelledByTheTick
CHECK_DEADLOCK FALSE
