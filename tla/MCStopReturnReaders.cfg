\* MCStopReturn (StopReturn.tla): one read, two owners, generations to 4;
\* Broken = "none". STOP captures the readers' reading column as a debt, and a
\* read is returned asked at the next generation with its receipt by the
\* owner's own stop-return; a live reader lease is never settled by the beat
\* (its owner's stop-returns count includes the still-open read), so this case
\* checks the reader model and its invariants, not the beat settle.
SPECIFICATION Spec
CONSTANTS
    Cards = {r1}
    Owners = {o1, o2}
    Readers = {r1}
    MaxGen = 4
    Broken = "none"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    NoStaleGenOwned
    GoneNeverBlocksStart
