\* MCStopReturn (StopReturn.tla): one read, two owners, generations to 4;
\* Broken = "none". STOP captures the readers' reading column as a debt, and
\* once the reader has beaten since the STOP with its count at zero the debt
\* is settled by the beat (AbsentJobSettles): the read is returned asked at
\* the next generation without the owner's own receipt.
SPECIFICATION Spec
CONSTANTS
    Cards = {r1}
    Owners = {o1, o2}
    Readers = {r1}
    MaxGen = 4
    Broken = "none"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    NoStaleGenOwned
PROPERTIES
    AbsentJobSettles
