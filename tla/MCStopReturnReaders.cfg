\* MCStopReturn (StopReturn.tla): one read, two owners, generations to 4;
\* Broken = "none". STOP captures the readers' reading column as a debt, and
\* the read returns (or is kept by the beat while its count is positive)
\* asked at the next generation.
SPECIFICATION Spec
CONSTANTS
    Cards = {r1}
    Owners = {o1, o2}
    Readers = {r1}
    MaxGen = 4
    Broken = "none"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    NoStaleGenOwned
