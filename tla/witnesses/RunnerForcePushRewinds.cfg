\* Reversed witness: TLC must report BranchOnlyByHolder violated (a withdrawn job kept on disk force-pushes its stale head every pass and rewinds the new holder, defect 78).
CONSTANT Width = 2
CONSTANT MaxSlots = 1
CONSTANT MaxCrashes = 1
SPECIFICATION Spec
INVARIANT BranchOnlyByHolder
INVARIANT TypeOK
INVARIANT OneLiveHarnessPerJobDir
INVARIANT PidRecordedAtStart
INVARIANT JobDirNeverReused
INVARIANT HarnessInsideSlot
INVARIANT CleanOnlyAfterRecordedAndPushed
INVARIANT ReportRecordedAtMostOnce
INVARIANT FaultSpendsNoAttemptOrBounce
INVARIANT WorkingWithinWidth
INVARIANT SlotsWithinCapacity
INVARIANT PassNeverWaitsOnJobs
INVARIANT StopIsNeverAFault
