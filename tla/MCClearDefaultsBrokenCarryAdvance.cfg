    DefaultsAfterClear
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    SetSurvives
    NeverAbsent
    ReadersSeeWorking
    CarrySurvives
