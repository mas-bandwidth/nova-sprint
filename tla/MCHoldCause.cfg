\* MCHoldCause (HoldCause.tla): two members, one route, the cause-ended release, the cause-less report, the clear, the next-tick deferral, the idle-reap attribution, the parked wait and a hold with no live cause ended by unhold alone; Broken = "none".
SPECIFICATION Spec
