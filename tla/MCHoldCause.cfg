    NoHoldForARestedRoute
    NoSilentHold
    RouteFaultRests
    AParkedJudgmentKeepsItsHold
PROPERTIES
    HeldOnlyWhenAlone
    NoCauseEndsOnlyByUnhold
    CauseEndsHold
