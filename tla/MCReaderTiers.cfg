\* The code: a fleet reader serves a tier only while a route of it is enabled,
\* whatever its cell names; a friend reader reads only what her seat reaches; no
\* card is dealt on an unrouted tier; the tier judgment is raised, closes when a
\* route is enabled, and is never doubled; a held friend serves nothing; clear
\* keeps readers and read-cards on. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = TRUE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  Need <- MCNeed
INVARIANTS NoReadOutsideTier NoReadOnUnroutedTier NoCardOnUnroutedTier FriendReadsWithinHerSeat UnroutedIsJudged JudgedOnlyWhileUnrouted OneJudgmentPerCause NoReadToAHeldReader EmptyCellReadsEveryServedTier EveryUpMemberIsAReader ReadCardsStaysOn
