\* The design: a fleet reader with an empty cell reads flash only while the
\* store holds routes and every tier with none; a friend's reader with an empty
\* cell reads every tier; a held friend's reader serves nothing. The ask places
\* the card's reads together, each on a reader that serves its tier. Every
\* invariant holds.
SPECIFICATION Spec
CONSTANTS
 BugIgnoreHeld = FALSE
 BugEmptyReadsAll = FALSE
 RoutesExist = TRUE
 ReadsNeeded = 2
INVARIANTS NoReadOutsideTier NoReadToAHeldReader
