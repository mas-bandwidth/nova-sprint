\* The code: a fleet reader whose cell is empty reads every tier a route
\* serves, a held friend's reader row serves nothing, every up member has
\* its reader row, and read-cards stays on across a clear. Reads are asked
\* together. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = TRUE
  Need <- MCNeed
INVARIANTS NoReadOutsideTier NoReadToAHeldReader EmptyCellReadsEveryServedTier EveryUpMemberIsAReader ReadCardsStaysOn
