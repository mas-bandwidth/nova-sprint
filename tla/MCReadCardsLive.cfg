\* The live reads (v1.2.14): one attempt at Need 1 (LiveBound), every action of the deal and
\* the member's children and beats and the reconcile's LiveReturn. Every invariant holds,
\* NamedOrWithinGrace and NoGhostRead with them.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreSpent = FALSE
  Need = 1
  Live = TRUE
  BugNamesHeld = FALSE
  BugNoLiveReturn = FALSE
CONSTRAINT LiveBound
INVARIANTS TypeOK OneOpenPerReader AtMostNeedStanding NeverTheWorker NeverTwiceAfterSpent MergingOnlyOnOks NoOpenReadOfAnOldAttempt NamedOrWithinGrace NoGhostRead
