\* Reversed witness "noreset": an event does not reset heardAge, so a down friend never comes up on her events. One friend and one card: with heardAge no longer following the last event the state space grows past the runner budget, and the liveness does not involve a second friend or card.
SPECIFICATION SpecLive
CONSTANTS
 Friends = {f1}
 Cards = {c1}
 HeardUp = 2
 DeafHold = 2
 MaxEvents = 2
 Broken = "noreset"
INVARIANTS TypeOK
PROPERTIES DownComesUpOnNextEvent
