\* MCHolds (Holds.tla): one stream held, stopped, resumed and reopened, and
\* the second stream whose card o the cross need names; Broken = "none"; and
\* the held card, which may be working while the server default holds it, and
\* its release, the sentinel, with no card witness.
SPECIFICATION Spec
CONSTANTS
    Broken = "none"
    CardBroken = {}
INVARIANTS
    TypeOK
    HeldMovesOnlyByRelease
    NoHeldCardDealt
    OnlyCoordinatorReleases
    CutNeverWaives
    SentinelLandsOnlyWhenWaitsUnderWay
PROPERTIES
    HeldStreamDealsNothing
    CrossResumesAfterNeed
    OwnRefusalNeverStops
    ReleaseKeepsAWorkingCardWorking
