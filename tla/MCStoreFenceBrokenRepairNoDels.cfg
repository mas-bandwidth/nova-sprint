\* Reversed witness: Repair finishes a cut remove and empties the fence but does
\* not send the operation's durable row deletes. TLC must find the rows left.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1}
  Arg = {a1}
  Manifests = 1
  MaxTries = 1
  MaxEpoch = 1
  MaxStray = 1
  Timely = TRUE
  Broken = "repairnodels"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK CommittedRowsGone
