\* MCClearDefaults (ClearDefaults.tla); Broken = "overwrite": the set-defaults step overwrites a Set of the new epoch
\* (SetSurvives fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "overwrite"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
INVARIANTS
    SetSurvives
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    ReadersSeeWorking
    CarrySurvives
