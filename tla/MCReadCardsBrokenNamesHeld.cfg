\* Reversed witness (v1.2.14 ghost reads): the member's live set names a working read it
\* runs no child for (pkg/member's stage retry before v1.2.14 held the launch, waiting for a
\* packet its queue never sends), so the reconcile never sees it gone. TLC must find a read
\* working with no child for ever (deal, take, lose the child, then only beats).
SPECIFICATION LiveSpec
CONSTANTS
  BugIgnoreSpent = FALSE
  Need = 1
  Live = TRUE
  BugNamesHeld = TRUE
  BugNoLiveReturn = FALSE
CONSTRAINT LiveBound
INVARIANTS TypeOK
PROPERTIES NoGhostRead
