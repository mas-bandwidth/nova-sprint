\* The code with the proposed nonce, and a refusal a later write can undo (Revive = TRUE):
\* the second hole this model found, 2026-10-27, held as a case that fails until a fix
\* closes it. Repair abandons a live writer's operation at once on a rule refusal, and a
\* manifest carries no check of the fence, so the writer's own send can apply after it.
\* Trace (TLC), checked against the code by hand:
\*  1. w1 acquires the fence (redis.go Acquire :676-713) and is delayed before its first
\*     send (Store.apply, engine.go:944).
\*  2. A write outside the fence makes w1's first manifest refused on a rule
\*     (MEMBEREXISTS, not curable: engine.go:1353).
\*  3. w2's fenced read finishes w1's operation: the repairer's own send is refused on the
\*     rule and it abandons at once, inside the grace, w1 alive (engine.go:2253, :2279).
\*  4. w2 plans, acquires its own operation and applies its first manifest, which makes
\*     w1's refused expectation hold again (the member deleted; unverified that a plan
\*     can do this to a MEMBEREXISTS refusal).
\*  5. w1 resumes: its first manifest applies with no check of the fence (engine.go:1866),
\*     inside w2's fence. Its Release(op, true) finds another id there, writes nothing
\*     and returns success, and its caller is told ok (engine.go:970-981).
\* No grace is involved: it needs w1 delayed between Acquire and its first send for
\* longer than a fenced read, a finish, and w2's read, plan, acquire and first send.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = TRUE
  Broken = "none"
  Nonce = TRUE
  Revive = TRUE
  None = None
INVARIANTS TypeOK AbandonedAppliedNothing
