\* LandEdge.tla's liveness for a base that moves under a gate whose CI is
\* still queued: it is let go and rebuilt on the tip even when CI never
\* starts (QueuedLiveSpec; Flaky off). ci-tlc.sh runs it; it must pass.
CONSTANT K = 1
CONSTANT BackedUp = 2
CONSTANT MaxPass = 6
CONSTANT SharedRed = TRUE
CONSTANT Flaky = FALSE
SPECIFICATION QueuedLiveSpec
INVARIANT TypeOK
PROPERTY MovedQueuedLetsGo
