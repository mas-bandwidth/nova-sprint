\* The design: the deal cuts every read the attempt still needs, each to a
\* different reader; a reader that spent a read is never dealt it again; the
\* machine's take-back spends no one and is dealt again up to MaxGen; a merging
\* card short of its reads goes back to review. Every invariant holds. The live
\* reads are MCReadCardsLive.cfg's (Live = TRUE).
SPECIFICATION Spec
CONSTANTS
  BugIgnoreSpent = FALSE
  Need = 2
  Live = FALSE
  BugNamesHeld = FALSE
  BugNoLiveReturn = FALSE
  BugPlainOnly = FALSE
INVARIANTS TypeOK OneOpenPerReader AtMostNeedStanding NeverTheWorker NeverTwiceAfterSpent MergingOnlyOnOks NoOpenReadOfAnOldAttempt OkReadsAccept
