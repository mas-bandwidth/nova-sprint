\* The design: the deal hands a read only to a free slot, the tick levels a read untaken past
\* the start bound to another reader with a free slot, and friend give moves a read only to a
\* free slot of a friend who is not its author. Every property holds.
SPECIFICATION Spec
CONSTANTS
  Reads = {p1, p2}
  Bound = 1
  BadDeal = "none"
  BadLevel = FALSE
  BadGive = "none"
INVARIANTS TypeOK ReadOnlyToAFreeSlot SlotsHard NeverTheAuthor
PROPERTIES LevelledByTheTick
CHECK_DEADLOCK FALSE
