\* Reversed witness: the ask places a read while a read of the attempt is
\* broken (the ask without the interim rule's "none once broken" guard). Three
\* readers, so a card with a broken read still has a reader free to ask. TLC
\* must find a card that asked a read while a read stood broken, where
\* NoAskWhileBroken fails.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Rule = "parallel"
 Broken = "askbroken"
INVARIANTS TypeOK NoAskWhileBroken
