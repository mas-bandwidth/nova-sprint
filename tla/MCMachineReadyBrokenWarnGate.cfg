\* MCMachineReady (MachineReady.tla); Broken = "warngate": start warns over a clean record of cards holding warnings (UncheckedStartWarns fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "warngate"
INVARIANTS
    WarnOnlyStarts
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    StartOnlyChecked
    UncheckedStartWarns
    StartNeverGatedByCheck
    CleanRecordHasNoDefect
    WarnsNeverFail
