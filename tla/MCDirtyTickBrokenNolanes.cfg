\* nolanes: the take drops its lane guard, so a member of width 1 takes the two
\* cards it holds, and LanesRespected fails.
SPECIFICATION Spec
CONSTANTS
 Streams = {"s1", "s2"}
 Cards = {"c1", "c2"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1"}
 Width <- MCWidth
 DealAhead <- MCDealAhead
 ReadCost <- MCReadCost
 MOrder <- MCMOrder
 Readers = {"r1"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 1
 MaxRedeals = 1
 Takes = TRUE
 Coord = FALSE
 MaxActs = 2
 MaxSub = 12
 CtrMod = 2
 Addable = {}
 Scn <- ScnLanes
 Fixes = {"seefleet", "pendingroom"}
 Broken = "nolanes"
INVARIANTS TypeOK LanesRespected
