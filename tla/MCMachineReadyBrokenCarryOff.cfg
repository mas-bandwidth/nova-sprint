\* MCMachineReady (MachineReady.tla); Broken = "carryoff": a clear that
\* carries an off into the new epoch (DefaultsAfterClear fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "carryoff"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    DefaultsAfterClear
    ClearLeavesReady
    TypeOK
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    NeverAbsent
