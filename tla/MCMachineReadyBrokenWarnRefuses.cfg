\* MCMachineReady (MachineReady.tla); Broken = "warnrefuses": a check of warnings alone fails, so serialized overlap never starts (WarnsNeverFail fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "warnrefuses"
INVARIANTS
    WarnsNeverFail
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    StartOnlyChecked
    UncheckedStartWarns
    CleanRecordHasNoDefect
    WarnOnlyStarts
