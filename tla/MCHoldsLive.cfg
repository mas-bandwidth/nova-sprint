\* MCHolds (Holds.tla): the no-stall rule's liveness. Under fairness of the
\* coordinator's answers and the machine's steps, a card the coordinator does
\* not hold lands (Progress); a stopped stream always has an open judgment or
\* is the coordinator's hold (NoSilentStall). Broken = "none".
SPECIFICATION FairSpec
CONSTANTS
    Broken = "none"
    CardBroken = {}
INVARIANTS
    TypeOK
    NoSilentStall
PROPERTIES
    HeldStreamDealsNothing
    CrossResumesAfterNeed
    OwnRefusalNeverStops
    Progress
