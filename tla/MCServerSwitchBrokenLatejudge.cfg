\* The reversed witness "latejudge": the refusal's judgment is raised only after the
\* stall bound (the stuck-landing judgment's LandDeadline, the tick's landing-stall
\* alarm), never on its first beat, a counterexample to RefusalJudgedAtOnce; the run
\* is expected to fail naming that property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"latejudge"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand
