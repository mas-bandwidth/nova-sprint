\* control: every tier is dealt from its routes; c5 an unpinned frontier card, c7 a pinned one; no SYMMETRY (unsound with liveness)
SPECIFICATION LiveSpec
CONSTANTS
 Tiers = {"flash", "frontier"}
 Arr <- MCArrF
 Cards = {c1, c2, c5, c7}
 ProCards = {c5, c7}
 TierOf <- MCTierOfF
 Pinned = {c7}
 Reads = {}
 MaxRedeals = 1
 First = {}
 Rested <- MCRested
 Avoid <- MCAvoid
 ReadTier <- MCReadTier
 Broken = "none"
 Members = {"m1", "m2"}
 MemberUnlaunch <- MCMemberUnlaunch
 BenchOf <- MCBenchOf
 Refused <- MCRefused
 BenchedCards = {}
 RefusedCards = {}
INVARIANTS TypeOK RouteIndexAdvancesOncePerCard ExcludedNeverDrawn NeverUnlaunchable StrandedIsJudged
PROPERTIES PinNeverAdvances EveryTierIsDealtFromItsRoutes
