\* The free rule (Level.tla THE FREE RULE) with every invariant: a move only off
\* a member above its width (NeverOffAFreeLane), only onto one below it
\* (NeverOntoAFullMember), and no excess card left while a lane is free when the
\* call ends (NoExcessWhileALaneIsFree), with the potential and the termination.
SPECIFICATION Spec
CONSTANTS
 Order <- MCOrder3
 Cards <- MCCards3
 Width <- MCWidth3
 Works <- MCWorks3
 UpOrders <- MCUpAll3
 MaxRefusers = 1
 Rule = "free"
 Requeue = FALSE
INVARIANTS TypeOK NeverOnARefuser MovesBounded SelectionComplete NoExcessWhileALaneIsFree
PROPERTIES PotentialFalls Terminates NeverOffAFreeLane NeverOntoAFullMember
