\* MCMachineReady (MachineReady.tla); Broken = "leaveone": a clear whose
\* set-defaults step leaves one setting absent (NeverAbsent fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "leaveone"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    NeverAbsent
    ClearLeavesReady
    TypeOK
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
