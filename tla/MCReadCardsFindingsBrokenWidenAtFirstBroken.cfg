\* Reversed witness: the read-broken rule widens PATHS in place at the first broken read
\* while the second is still working, its Brief retiring it ("retired at ... by brief"). The
\* next attempt's work starts, and only then does the second reader report: the machine made
\* it late, and it missed the brief of the attempt it was for. TLC must find that finding.
SPECIFICATION Spec
