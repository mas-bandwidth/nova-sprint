  BugIgnoreSpent = FALSE
  Need = 2
  Live = FALSE
  BugNamesHeld = FALSE
  BugNoLiveReturn = FALSE
  Findings = TRUE
  BugDropLate = FALSE
  BugReworkAtFirstBroken = FALSE
  BugWidenAtFirstBroken = TRUE
  BugLateMissesRunning = FALSE
INVARIANTS TypeOK NoFindingLost
