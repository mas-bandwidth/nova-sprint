\* MCMachineReady (MachineReady.tla); Broken = "carryadvance": the advance carries the old epoch's settings
\* (DefaultsAfterClear fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "carryadvance"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    DefaultsAfterClear
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    SetSurvives
    NeverAbsent
    ReadersSeeWorking
