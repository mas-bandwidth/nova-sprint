\* MCClearDefaults (ClearDefaults.tla); Broken = "nonatomicrestore": the restore's marker is checked once, before
\* the restore, and its row writes do not check it again, as at 90b5ae7d: two clears both find it absent, one restores
\* and marks, a row is removed, the other restores it again (RerunKeepsEpochWrites fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 2
    Broken = "nonatomicrestore"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
    Rows = {"r1", "r2"}
    Procs = {a, b}
INVARIANTS
    RerunKeepsEpochWrites
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
    FinishOnlyWhatIsOwed
    MembersRestored
    EpochZeroNeverOwed
