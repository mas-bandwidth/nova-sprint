\* MCStopReturn (StopReturn.tla): two cards, two owners, generations to 4;
\* Broken = "clearblocked". Clear drops the live-lease guard and advances while
\* a live work/read lease remains (ClearNeverWithALiveLease fails).
SPECIFICATION Spec
CONSTANTS
    Cards = {c1, c2}
    Owners = {o1, o2}
    Readers = {}
    MaxGen = 4
    Broken = "clearblocked"
INVARIANTS
    TypeOK
    NoLiveChildAcrossStart
    UnreturnedStaysPut
    ClearNeverWithALiveLease
    ClearEnabled
PROPERTIES
    ReturnedFreesItsRow
    AbsentJobSettles
