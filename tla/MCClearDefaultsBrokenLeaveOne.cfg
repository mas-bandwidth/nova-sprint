\* MCClearDefaults (ClearDefaults.tla); Broken = "leaveone": a clear whose
\* set-defaults step leaves one setting absent (NeverAbsent fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "leaveone"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
    Rows = {"r1", "r2"}
INVARIANTS
    NeverAbsent
    ClearLeavesReady
    TypeOK
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
    FinishOnlyWhatIsOwed
    MembersRestored
    EpochZeroNeverOwed
    RerunKeepsEpochWrites
