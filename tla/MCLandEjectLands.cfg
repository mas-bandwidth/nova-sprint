\* control: the eject under fairness (the coordinator runs land again): a bad card at the front never holds the cards that do not need it, EjectLands (Recovers is MCLandRecovers's, with no needs: a card blocked on its needs accepted ahead of a pushed batch strands it under this model's prefix guard, which the code's guard by name does not)
SPECIFICATION FairSpec
CONSTANTS
 c1 = c1
 c2 = c2
 c3 = c3
 Cards = {c1, c2, c3}
 Needs <- EjectNeeds
 Bad <- EjectBad
 MaxAttempts = 2
 MaxEpoch = 1
 MaxEvents = 3
 Broken = "none"
PROPERTIES EjectLands
