\* The design: the free rule (Level.tla THE FREE RULE; it was the gap and mean
\* rule, now checked by MCLevelBrokenMeanRule): a card moves only off a member
\* above its width onto one below it, the refusers skipped, a moved card never
\* queued again. Every invariant, the potential and the termination hold.
SPECIFICATION Spec
CONSTANTS
 Order <- MCOrder3
 Cards <- MCCards3
 Width <- MCWidth3
 Works <- MCWorks3
 UpOrders <- MCUpAll3
 MaxRefusers = 1
 Rule = "free"
 Requeue = FALSE
INVARIANTS TypeOK NeverOnARefuser MovesBounded SelectionComplete
PROPERTIES PotentialFalls Terminates
