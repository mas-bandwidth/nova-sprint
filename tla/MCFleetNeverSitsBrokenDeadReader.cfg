\* Reversed witness "deadreader": ReaderDeadline is disabled, so a reader that
\* stops taking (ReaderDeaf: hulk) holds its dealt read forever while another
\* live reader is up. ReadTaken must fail.
SPECIFICATION Spec
CONSTANTS
  Cards <- MCCards
  Members <- MCMembers
  Readers <- MCReaders
  Routes <- MCRoutes
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {"deadreader"}
INVARIANTS NoAwayReaderHolds
PROPERTIES ReadTaken
