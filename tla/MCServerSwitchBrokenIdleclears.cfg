\* The reversed witness "idleclears": a round that ran no land (nothing queued, or no
\* coordinator on land's own re-read) clears a standing refusal with nothing landed,
\* a counterexample to RefusalClearsOnlyWhenItsCauseIsGone; the run is expected to
\* fail naming that property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"idleclears"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
