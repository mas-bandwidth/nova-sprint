\* Reversed witness: the bound is the load window past the highest placed card
\* alone (v1.4.3): a reader whose read the machine took back past the window has
\* no placed card, so its next generation is refused for good (deal gen 0, take it
\* back, gen 1 refused with Window 0). TLC must find the wedged reader.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreSpent = FALSE
  Need = 1
  Live = FALSE
  BugNamesHeld = FALSE
  BugNoLiveReturn = FALSE
  BugPlacedWindow = TRUE
INVARIANTS TypeOK NeverWedged
