\* reversed witness: the fence is dropped, so a crash leaves a step
\* half-written (its fleet writes committed, its work-table write pending) and
\* other actions may act on the half-written table; a repair then applies the
\* stale deferred write (NoCardLostOrTwice fails)
SPECIFICATION CrashSpec
CONSTANTS
 c1 = c1
 Card <- MCCard
 Sentinels <- MCSentinels
 NeedsOf <- MCNeedsOf
 Score <- MCScore
 InitOf <- MCInitOf
 Member <- MCMember
 InitUp <- MCInitUp
 Reader <- MCReader
 Flash <- MCFlash
 MemberReader <- MCMemberReader
 Rewrites <- MCRewrites
 StreamOf <- MCStreamOf
 MergeSide = FALSE
 Broken = "halfstep"
INVARIANTS TypeOK NoNeedCycle
PROPERTIES NoCardLostOrTwice
