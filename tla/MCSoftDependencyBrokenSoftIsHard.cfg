\* MCSoftDependencyBrokenSoftIsHard (SoftDependency.tla); Broken = "softishard": an unqueued, unlanded target holds its dependent (the rule before 2026-10-16), so SoftIsOrderOnly fails.
SPECIFICATION Spec
CONSTANTS
    Broken = "softishard"
INVARIANTS
    SoftIsOrderOnly
    TypeOK
    SoftNeverBlocksDeal
    SoftLandsInOrder
    HeldNeverEmptiesBatch
    DropReleasesSoft
    NoSoftAndNeedCycle
