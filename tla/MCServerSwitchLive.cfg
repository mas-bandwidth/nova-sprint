\* The design's liveness: the automatic land pass runs whatever the hook, so an
\* accepted card with the seat unhooked and the server running is landed or refused
\* for a reason other than the hook (LandingNeverWaitsOnTheHook), under weak fairness
\* of the pass; and every refused landing is eventually reported to the seat
\* (RefusalIsReported). The safety invariants hold too.
\* This is the routine runner's bounded case: the liveness over the restart (which loses
\* the loop's memory), the judgment's storage, the owed close and the seat's closes does
\* not fit the runner's 110 s budget at the full bounds, so here there is one switch, one
\* reason land refuses for (MCReasons1, with the pass fault and the unreadable queue) and
\* the clock to 3, where a window of 2 still has a past-the-deadline tick. The full bounds
\* (two switches, both reasons, the clock to 4) are MCServerSwitchLiveFull.cfg, a bench
\* case run in the runner's manual mode.
SPECIFICATION FairSpec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate1
 Reasons <- MCReasons1
 Window = 2
 MaxClock = 3
 MaxSwitch = 1
 Broken = {}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks StaleSilent BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
PROPERTIES
 LandingNeverWaitsOnTheHook RefusalIsReported
