\* The design's liveness: the automatic land pass runs whatever the hook, so an
\* accepted card with the seat unhooked and the server running is landed or refused
\* for a reason other than the hook (LandingNeverWaitsOnTheHook), under weak fairness
\* of the pass; and every refused landing is eventually reported to the seat
\* (RefusalIsReported). The safety invariants hold too.
\* The clock is bounded at 3 here (the safety config keeps 4): the liveness check over
\* the judgment's storage, the owed close and the seat's closes fits the runner's
\* per-case budget at 3, and a window of 2 still has a past-the-deadline tick.
SPECIFICATION FairSpec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 3
 MaxSwitch = 2
 Broken = {}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal RefusalJudgedAtOnce AtMostOneJudgmentPerRefusal AckSticks NoStaleAck BeatNamesTheRefusal RefusalOnlyWhenNothingCouldLand RefusalClearsOnlyWhenItsCauseIsGone
PROPERTIES
 LandingNeverWaitsOnTheHook RefusalIsReported
