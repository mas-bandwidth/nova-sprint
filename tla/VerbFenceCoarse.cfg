\* VerbFence.tla on an op fenced on every card too (Coarse: hold of a
\* stream, UnchangedSince cards): a write the verb names nowhere refuses
\* the op, and the verb reads again and commits.
CONSTANTS
  Tries = 4
  MaxEnv = 3
  Coarse = TRUE
  Writers = {"deal", "land", "hold", "old", "touch"}
  OwnCheck = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT Follows
INVARIANT NoOrphan
INVARIANT TargetLive
INVARIANT OwnKept
INVARIANT NeverStuck
PROPERTY Ends
