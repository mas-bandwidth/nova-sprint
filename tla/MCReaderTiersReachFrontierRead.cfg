\* Reachability: once a frontier route is enabled the frontier read is asked
\* (ReachFrontierRead is written false where the design must reach). TLC must
\* fail ReachFrontierRead.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = TRUE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  StoreKind = "real"
  BugShortcutOnRealStore = FALSE
  Need <- MCNeed
INVARIANTS ReachFrontierRead
