\* Reversed witness: repair abandons an aged operation even when its first manifest
\* applied (engine.go finishOp's i == 0 guard dropped). TLC must find an abandoned
\* operation whose manifests the tables hold.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  Timely = TRUE
  Broken = "abandonapplied"
  None = None
INVARIANTS TypeOK AbandonedAppliedNothing
