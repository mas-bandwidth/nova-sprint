\* Reversed witness: repair abandons an aged operation even when its first manifest
\* applied (engine.go finishOp's rule dropped: abandon only after its own send of the
\* first manifest failed, :2218, and sentBefore says it never applied, :2275). TLC must
\* find an abandoned plan whose manifests the tables hold.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = TRUE
  Broken = "abandonapplied"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK AbandonedAppliedNothing
