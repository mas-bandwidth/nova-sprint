\* The code: the interim parallel rule of 2026-10-06, a card's reads asked
\* together by room. ReadsPerLanding holds as Need * (broken attempts + 1);
\* the sequential rule's OneAtATime and OneBroken do not hold here (reads are
\* asked together and can break together). FinderFirst, WidthRespected and
\* NoAskWhileBroken hold, and the liveness holds.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Rule = "parallel"
 Broken = "none"
INVARIANTS TypeOK WidthRespected ReadsPerLanding FinderFirst NoAskWhileBroken
PROPERTIES Settles
