\* MCMachineReady (MachineReady.tla); Broken = "stalerecord": start reads the check record's verdict and not its digest, so a change after a clean check starts (StartOnlyChecked fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "stalerecord"
INVARIANTS
    StartOnlyChecked
    UncheckedStartWarns
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    CleanRecordHasNoDefect
    WarnsNeverFail
    WarnOnlyStarts
