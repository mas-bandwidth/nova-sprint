\* Reversed witness: a frontier work card is dealt to a machine with no
\* frontier route (routeless, a member override). TLC must fail
\* NoCardOnUnroutedTier.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = TRUE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = TRUE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  Need <- MCNeed
INVARIANTS NoCardOnUnroutedTier
