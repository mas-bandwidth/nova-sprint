\* MCClearDefaults (ClearDefaults.tla); Broken = "noguard": a row is edited or removed while the restore is pending
\* (no marker yet), and the clear run again restores over it (RerunKeepsEpochWrites fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 2
    Broken = "noguard"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
    Rows = {"r1", "r2"}
    Procs = {a, b}
INVARIANTS
    RerunKeepsEpochWrites
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
    FinishOnlyWhatIsOwed
    MembersRestored
    EpochZeroNeverOwed
