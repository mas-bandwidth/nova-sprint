\* MCMachineReady (MachineReady.tla); Broken = "readyjudges": a READY machine
\* with moves due raises machine:stopped (ReadyNeverJudges fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "readyjudges"
INVARIANTS
    ReadyNeverJudges
    TypeOK
    ClearLeavesReady
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    StartOnlyWorking
    DeliberateSetStarts
    StartOnlyChecked
    CleanRecordHasNoDefect
    WarnsNeverFail
    WarnOnlyStarts
