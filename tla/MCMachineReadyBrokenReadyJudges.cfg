\* MCMachineReady (MachineReady.tla); Broken = "readyjudges": a READY machine
\* with moves due raises machine:stopped (ReadyNeverJudges fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "readyjudges"
    Settings = {"read_cards", "fleet"}
    OneSetting = "read_cards"
INVARIANTS
    ReadyNeverJudges
    TypeOK
    ClearLeavesReady
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
