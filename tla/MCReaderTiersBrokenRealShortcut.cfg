\* Reversed witness: the twin's shortcut taken on a real store (the v1.4.6
\* head, len(s.Routes) == 0 on any store): a real store with no route deals a
\* card or a fleet read on its member's own model. TLC must fail
\* NoDealOnRealStoreWithoutRoutes.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = FALSE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  StoreKind = "real"
  BugShortcutOnRealStore = TRUE
  Need <- MCNeed
INVARIANTS NoDealOnRealStoreWithoutRoutes
