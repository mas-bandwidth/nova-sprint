\* A real store (Redis) that starts with no route at all, the coordinator then
\* enabling and disabling a route of any tier: no card and no fleet read is
\* dealt while it holds none, each tier with work waiting is judged and its
\* judgment closes once a route of it is enabled. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  BugIgnoreHeld = FALSE
  BugEmptyFlashOnly = FALSE
  BugClearDropsReaders = FALSE
  BugClearTurnsOff = FALSE
  RoutesExist = FALSE
  BugReadsRegardlessOfRoutes = FALSE
  BugDealUnrouted = FALSE
  BugJudgmentStays = FALSE
  BugTwoJudgments = FALSE
  BugFriendAnyTier = FALSE
  StoreKind = "real"
  BugShortcutOnRealStore = FALSE
  Need <- MCNeed
INVARIANTS NoReadOutsideTier NoReadOnUnroutedTier NoCardOnUnroutedTier NoDealOnRealStoreWithoutRoutes FriendReadsWithinHerSeat UnroutedIsJudged JudgedOnlyWhileUnrouted OneJudgmentPerCause NoReadToAHeldReader EmptyCellReadsEveryServedTier EveryUpMemberIsAReader ReadCardsStaysOn
