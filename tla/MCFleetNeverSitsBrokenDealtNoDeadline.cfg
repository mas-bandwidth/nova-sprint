\* Reversed witness "dealtnodeadline": StartDeadline is disabled, so a card
\* dealt to a member that never takes it sits dealt forever. WorkStarts must
\* fail (a live, eligible member exists).
SPECIFICATION Spec
CONSTANTS
  Cards <- MCSmallCards
  Members <- MCMembers
  Readers <- MCReaders
  Routes <- MCRoutes
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {"dealtnodeadline"}
INVARIANTS NoDealtPastT
PROPERTIES WorkStarts
