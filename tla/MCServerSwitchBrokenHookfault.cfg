\* The reversed witness "hookfault": a land the hook gate refused before it acted is
\* counted as a land fault (the v1.2.12 switch rolled itself back 1.5 seconds after it
\* began, on the new server's first pass, before the seat hooked in again), so inside the
\* window it rolls the switch back, a counterexample to NoRollbackOnAHookRefusal; the run
\* is expected to fail naming that property.
SPECIFICATION Spec
CONSTANTS
 Binaries <- MCBinaries
 Candidate <- MCCandidate
 Window = 2
 MaxClock = 4
 MaxSwitch = 2
 Broken = {"hookfault"}
INVARIANTS
 TypeOK RollbackOnlyInWindow AtMostOneAutoRollbackPerSwitch TargetIsAKnownBinary NoRollbackOnAHookRefusal
