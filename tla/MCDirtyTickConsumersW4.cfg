\* W4: a member-down whose attempts are not re-dealt (no re-pump): a card on
\* a machine that lapsed is left working with no attempt held, so ConsumersOut
\* fails.
SPECIFICATION Spec
CONSTANTS
 Streams = {"s1", "s2"}
 Cards = {"c1"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1", "m2"}
 Width <- MCWidth2
 DealAhead <- MCDealAhead
 ReadCost <- MCReadCost
 MOrder <- MCMOrder
 Readers = {"r1", "r2"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 2
 MaxRedeals = 1
 Takes = FALSE
 Coord = FALSE
 MaxActs = 0
 MaxSub = 32
 CtrMod = 2
 Addable = {}
 Scn <- ScnConsumersLapse
 Fixes = {"seefleet", "pendingroom"}
 Broken = "none"
INVARIANTS TypeOK
PROPERTIES ConsumersOut
