\* The code as it is (Nonce = FALSE): the hole this model found, 2026-10-27, held as a
\* case that fails until a fix closes it. Two writers serving one caller op at one
\* epoch build the same operation id, and Release matches the fence by id alone.
\* Trace (TLC), checked against the code by hand:
\*  1. w1 and w2 run caller op c1 at epoch 1; each builds id c1~1-1 (attempt 1 counted
\*     at engine.go:588, the id at :817, schema.go OpFamily :201).
\*  2. w1 acquires the fence with its plan (redis.go Acquire :676-713).
\*  3. A write outside the fence makes w1's first manifest refused on a rule
\*     (MEMBEREXISTS, not curable: engine.go curable :1353).
\*  4. w2's fenced read finds w1's operation pending and finishes it (fencedRead
\*     engine.go:437, finishOp): the repairer's own send is refused on the rule, so it
\*     abandons at once, inside the grace (:2253, :2279). The abandonment records no
\*     caller result (abandonment() sets no CallerOp; redis.go:890).
\*  5. w2's callerOp finds no result; w2 plans, builds c1~1-1 and acquires (the
\*     generation moved only at w1's acquire).
\*  6. w1 sends its first manifest: refused on the same rule. committed() finds no
\*     result, and w1 calls Release(op, false) (engine.go:957-959). The fence's record
\*     begins with id c1~1-1, so Release empties it (redis.go:727-747; mem.go:1110).
\*  7. w2 sends its first manifest with no check of the fence (apply, engine.go:1866):
\*     it applies, and w2's operation is partly applied with the fence empty.
\* Then any writer may acquire and write between w2's manifests, and w2's commit finds
\* the fence empty, writes nothing and returns success: its caller is told ok with no
\* result recorded. No timing assumption is needed. Needs two runs of one caller op at
\* once (a caller retrying while its first request is in flight) and a first manifest
\* refused on a rule.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = TRUE
  Broken = "none"
  Nonce = FALSE
  Revive = FALSE
  None = None
INVARIANTS TypeOK NoPartialOutsideFence
