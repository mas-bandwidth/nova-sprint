\* A stream deleted, repaired, and added again before a crashed remover releases
\* late: the owner guard suppresses the stale row deletes and the release succeeds.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1}
  Arg = {a1}
  Manifests = 1
  MaxTries = 1
  MaxEpoch = 1
  MaxStray = 1
  Timely = TRUE
  Broken = "lateadd"
  Nonce = TRUE
  Revive = FALSE
  None = None
INVARIANTS TypeOK NoPartialOutsideFence RowDelHeldFence
