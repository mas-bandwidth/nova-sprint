\* MCMachineReady (MachineReady.tla); Broken = "nogate": start reads no setting, so a
\* cleared epoch whose clear left read_cards non-working starts (StartOnlyWorking fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Settings = {"read_cards", "git_identity"}
    Broken = "nogate"
INVARIANTS
    StartOnlyWorking
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DeliberateSetStarts
