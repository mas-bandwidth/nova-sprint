\* MCClearDefaults (ClearDefaults.tla); Broken = "restoreskip": the clear run again over an owed epoch sets
\* the defaults and clears the flag without restoreMembers (MembersRestored fails).
SPECIFICATION Spec
CONSTANTS
    MaxEpoch = 3
    Broken = "restoreskip"
    Settings = {"read_cards", "alarm_review"}
    Carry = {"alarm_review"}
    OffWhenAbsent = {"alarm_review"}
    OneSetting = "read_cards"
    Rows = {"r1", "r2"}
INVARIANTS
    MembersRestored
    TypeOK
    ClearLeavesReady
    ReadyNeverJudges
    StoppedOnlyFromRunning
    StoppedWithDueJudges
    RanIsNotReady
    DefaultsAfterClear
    NeverAbsent
    SetSurvives
    ReadersSeeWorking
    CarrySurvives
    FinishOnlyWhatIsOwed
    EpochZeroNeverOwed
    RerunKeepsEpochWrites
