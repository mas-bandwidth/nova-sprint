\* Reversed witness: release empties the fence whatever it holds (redis.go Release's
\* check of the held operation's id dropped). TLC must find an operation partly applied
\* outside the fence.
SPECIFICATION Spec
CONSTANTS
  Writer = {w1, w2}
  Caller = {c1, c2}
  Arg = {a1, a2}
  Manifests = 2
  MaxTries = 2
  MaxEpoch = 2
  MaxStray = 1
  Timely = TRUE
  Broken = "releaseanyop"
  Nonce = TRUE
  None = None
INVARIANTS TypeOK NoPartialOutsideFence
