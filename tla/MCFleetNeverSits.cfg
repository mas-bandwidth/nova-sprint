\* The code: the fleet's four rules hold. No run is past its progress bound, no
\* dealt card past its start bound, no away reader holds a read, an idle member
\* with ready work has a named cause, and a card that can run does, a stale run
\* ends, and a read with a live reader is taken.
SPECIFICATION Spec
CONSTANTS
  Cards <- MCSmallCards
  Members <- MCMembers
  Readers <- MCReaders
  Routes <- MCRoutes
  T <- MCT
  N <- MCN
  D <- MCD
  MaxTime <- MCMaxTime
  MaxWidth <- MCMaxWidth
  cardTags <- MCCardTags
  memberTags <- MCMemberTags
  Broken = {}
INVARIANTS TypeOK NoRunWithoutProgressPastT NoDealtPastT NoAwayReaderHolds IdleHasCause
PROPERTIES WorkStarts RunProgress ReadTaken
