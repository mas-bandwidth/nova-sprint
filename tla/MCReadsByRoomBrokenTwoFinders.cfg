\* The parallel rule asks a card's reads together, so two reads can break
\* together: TLC must find an attempt with two broken reads, where the
\* sequential design's OneBroken (the finder needs no order among readers)
\* fails.
SPECIFICATION Spec
CONSTANTS
 Readers <- MCReaders
 Width <- MCWidth
 Cards <- MCCards
 Need <- MCNeed
 MaxAttempts = 2
 Rule = "parallel"
 Broken = "none"
INVARIANTS TypeOK OneBroken
