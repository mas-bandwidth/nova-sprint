\* The lanes control (ScnLanes, Broken none): m1 of width 1 holds c1 and c2 and
\* its worker asks to take both; the fleet applies the first take and refuses
\* the second at its width (takeOne), so LanesRespected holds.
SPECIFICATION Spec
CONSTANTS
 Streams = {"s1", "s2"}
 Cards = {"c1", "c2"}
 StreamOf <- MCStreamOf
 Pos <- MCPos
 Sents = {}
 COrder <- MCCardOrder
 Machines = {"m1"}
 Width <- MCWidth
 DealAhead <- MCDealAhead
 MOrder <- MCMOrder
 Readers = {"r1"}
 ROrder <- MCROrder
 Host <- MCHost
 SOrder <- MCSOrder
 MaxAttempts = 1
 MaxRedeals = 1
 Takes = TRUE
 Coord = FALSE
 MaxActs = 2
 MaxSub = 12
 CtrMod = 2
 Addable = {}
 Scn <- ScnLanes
 Fixes = {"seefleet", "pendingroom"}
 Broken = "none"
INVARIANTS TypeOK LanesRespected
