# nova-sprint CI: build, vet, the unit tier and the functional tier, cut down
# from nova-tools' ci.yml to this module. Both tiers run on GitHub-hosted
# ubuntu-latest runners; the functional tier (below) installs redis-server and
# runs make functional-gate for every pull request and push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # git 2.46 and later end a commit or merge by starting `git maintenance run --auto
      # --detach`, a background process that can still be writing into a test's scratch
      # repository when t.TempDir's cleanup removes it ("TempDir RemoveAll cleanup: unlinkat
      # .../.git: directory not empty", runs 38113099837 and 38139628561 on git 2.55). Auto
      # maintenance is off for every git the tests start, the code's own git included, by
      # GIT_CONFIG_PARAMETERS (what `git -c` passes to its children). Not GIT_CONFIG_COUNT and
      # GIT_CONFIG_KEY_0: the code's own env scrub drops every name carrying KEY
      # (goenv.WithoutSecrets), which left a COUNT with no key and every git refusing.
      GIT_CONFIG_PARAMETERS: "'maintenance.auto'='false'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        # every test but the tick's wall-clock gate, which runs alone in the next step
        run: go test -p 4 -skip '^TestTickDrainAndDealUnderTheGateAtLoad$' ./...
      - name: tick deal under the gate, alone
        # TestTickDrainAndDealUnderTheGateAtLoad times the deal on a loaded store against the
        # one-second gate (internal/sprint/deal_load_bench_test.go). Beside three sibling
        # packages on this four-core runner every one of its ticks is slowed, so its least-of-
        # several reading measured the runner's load, not the deal: 1.19 s in run 38121929406,
        # where the same code measures 0.27-0.28 s alone and 0.53 s beside the suite on four
        # cores of a bench. It runs here with the runner to itself, as the tick runs on the
        # server; nothing is skipped, and it runs whether or not the step before passed.
        if: ${{ !cancelled() }}
        run: go test -count=1 -run '^TestTickDrainAndDealUnderTheGateAtLoad$' ./internal/sprint/
      - name: page lock only grows
        # the dashboard page's lock (internal/sprintdash/pagelock.go): every line of the base's
        # pagelock.txt is kept, so a page change is a new line with the owner's new ask; the base
        # is the pull request's base commit as the event recorded it (base.sha, the commit the
        # merge ref was built on, never the live branch: a landing on the base during the run
        # would otherwise make every open pull request red), or, for a push, the commit the
        # push moved from
        # it runs whether or not the test step passed, so a red suite elsewhere never hides it
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')) }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
          fi
          PAGELOCK_BASE=FETCH_HEAD go test -count=1 -run 'TestThePageLockOnlyGrows' ./internal/sprintdash/
          # the unit-test rule's allowance (internal/ci/unit_rule_allowed.txt) only shrinks
          # against the same base: a new allowance line is red
          UNIT_RULE_BASE=FETCH_HEAD go test -count=1 -run 'TestTheUnitRuleAllowanceOnlyShrinks' ./internal/ci/
          # the one-source allowance (internal/ci/one_source_allowed.txt: pkg/ copies of nova-tools
          # not yet merged) only shrinks against the same base
          UNIT_RULE_BASE=FETCH_HEAD go test -count=1 -run 'TestTheOneSourceAllowanceOnlyShrinks' ./internal/ci/

  # functional is the functional tier, run per pull request and push to main on
  # ubuntu-latest: redis-server is installed as the store the tests spawn their
  # own throwaway servers from, a missing redis-server fails closed under
  # NOVA_CI=1, and each package is bounded at two minutes by make functional-gate.
  # The dead code rule (TestDeadCode, Makefile DEAD_CODE_TEST) runs as one leg per
  # GOOS it measures: run whole in one leg, its 18 whole-program deadcode runs took
  # 100-120 s of the two minutes on this four-core runner and timed out at 2m0s
  # (runs 39466958320, 39488248860, 39645540672). Each deadcode-<goos> leg writes its
  # GOOS's shard and the deadcode-ledger job below holds their union to the ledger,
  # the same comparison as the whole run (internal/ci/dead_code_shard_test.go).
  functional:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_PARAMETERS: "'maintenance.auto'='false'"
    strategy:
      fail-fast: false
      matrix:
        leg: [rest, deadcode-linux, deadcode-darwin, deadcode-windows, "1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: redis-server
        # the dead code legs start no store
        if: ${{ !startsWith(matrix.leg, 'deadcode-') }}
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: functional tier
        run: |
          case "${{ matrix.leg }}" in
            rest) make functional-gate-rest ;;
            deadcode-linux) make functional-gate-deadcode-shard DEADCODE_GOOS=linux DEADCODE_OUT="${RUNNER_TEMP}/deadcode/linux.json" ;;
            deadcode-darwin) make functional-gate-deadcode-shard DEADCODE_GOOS=darwin DEADCODE_OUT="${RUNNER_TEMP}/deadcode/darwin.json" ;;
            deadcode-windows) make functional-gate-deadcode-shard DEADCODE_GOOS=windows DEADCODE_OUT="${RUNNER_TEMP}/deadcode/windows.json" ;;
            1/3) make functional-gate-shard SHARD=1 SHARDS=3 ;;
            2/3) make functional-gate-shard SHARD=2 SHARDS=3 ;;
            3/3) make functional-gate-shard SHARD=3 SHARDS=3 ;;
            *) echo "unknown leg ${{ matrix.leg }}" >&2; exit 2 ;;
          esac
      - name: dead code shard
        if: ${{ startsWith(matrix.leg, 'deadcode-') }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: deadcode-${{ matrix.leg }}
          path: ${{ runner.temp }}/deadcode
          if-no-files-found: error
          retention-days: 1

  # deadcode-ledger joins the deadcode-<goos> legs' shards and holds their union to
  # the shrink-only ledger (internal/ci/testdata/dead_code_allowlist.txt). It runs
  # whatever the other legs did, and a missing shard is a failure, never a pass.
  deadcode-ledger:
    needs: functional
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_PARAMETERS: "'maintenance.auto'='false'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: deadcode-*
          path: ${{ runner.temp }}/deadcode
          merge-multiple: true
      - name: dead code ledger
        run: make functional-gate-deadcode-ledger DEADCODE_FROM="${RUNNER_TEMP}/deadcode"

  # tick-gate is the wall-clock gate the split moved out of nova-tools'
  # certification.yml: the dirty tick drive against a real store, every tick
  # held to MaxTickWall (NOVA_SPRINT_GATE_STORE=1 asserts it). It is a bench's
  # job, not a per-PR gate: run it by hand (workflow_dispatch) on a runner with
  # redis-server and enough cores to meet the one-second tick bound.
  tick-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: tick gate
        env:
          NOVA_CI: "1"
          NOVA_SPRINT_GATE_STORE: "1"
        run: go test -tags functional -run TestTheDirtyTickDriveOnAStore -count=1 -timeout 600s ./cmd/nova-sprint
