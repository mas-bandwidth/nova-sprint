# nova-sprint CI: build, vet and the unit tier, cut down from nova-tools'
# ci.yml to this module. The unit tier runs on GitHub-hosted runners. The
# functional tier (job `functional`) is the fleet's to run: it starts throwaway
# redis-servers and drives a real table layer, so it belongs on the fleet's
# self-hosted runner, never on hosted minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # git 2.46 and later end a commit or merge by starting `git maintenance run --auto
      # --detach`, a background process that can still be writing into a test's scratch
      # repository when t.TempDir's cleanup removes it ("TempDir RemoveAll cleanup: unlinkat
      # .../.git: directory not empty", runs 38113099837 and 38139628561 on git 2.55). Auto
      # maintenance is off for every git the tests start, the code's own git included, by
      # GIT_CONFIG_PARAMETERS (what `git -c` passes to its children). Not GIT_CONFIG_COUNT and
      # GIT_CONFIG_KEY_0: the code's own env scrub drops every name carrying KEY
      # (goenv.WithoutSecrets), which left a COUNT with no key and every git refusing.
      GIT_CONFIG_PARAMETERS: "'maintenance.auto'='false'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        # every test but the tick's wall-clock gate, which runs alone in the next step
        run: go test -p 4 -skip '^TestTickDrainAndDealUnderTheGateAtLoad$' ./...
      - name: tick deal under the gate, alone
        # TestTickDrainAndDealUnderTheGateAtLoad times the deal on a loaded store against the
        # one-second gate (internal/sprint/deal_load_bench_test.go). Beside three sibling
        # packages on this four-core runner every one of its ticks is slowed, so its least-of-
        # several reading measured the runner's load, not the deal: 1.19 s in run 38121929406,
        # where the same code measures 0.27-0.28 s alone and 0.53 s beside the suite on four
        # cores of a bench. It runs here with the runner to itself, as the tick runs on the
        # server; nothing is skipped, and it runs whether or not the step before passed.
        if: ${{ !cancelled() }}
        run: go test -count=1 -run '^TestTickDrainAndDealUnderTheGateAtLoad$' ./internal/sprint/
      - name: page lock only grows
        # the dashboard page's lock (internal/sprintdash/pagelock.go): every line of the base's
        # pagelock.txt is kept, so a page change is a new line with the owner's new ask; the base
        # is the pull request's base, or, for a push, the commit the push moved from
        # it runs whether or not the test step passed, so a red suite elsewhere never hides it
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')) }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
          fi
          PAGELOCK_BASE=FETCH_HEAD go test -count=1 -run 'TestThePageLockOnlyGrows' ./internal/sprintdash/

  # functional runs the functional tier (build tag functional) against a real
  # store for every pull request. It runs on the fleet's self-hosted runner,
  # never on GitHub-hosted minutes: it starts throwaway redis-servers and drives
  # a real table layer, and the tier is a per-PR gate now, not a bench's job.
  # NOVA_CI=1 makes a missing redis-server a failure, never a skip, so a green
  # run cannot be a run that skipped the store; the runner must have
  # redis-server on PATH. make functional bounds each package at two minutes
  # (the standing rule: one ideally, two max; a package over the bound is the
  # test's defect, never the runner's). The runner's registration is outside
  # this repository: see the card's report for the exact change owed.
  functional:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      NOVA_CI: "1"
      GIT_CONFIG_PARAMETERS: "'maintenance.auto'='false'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: redis-server on PATH
        run: |
          command -v redis-server >/dev/null || {
            echo "the functional runner needs redis-server on PATH for the store tests" >&2
            exit 1
          }
      - name: functional tier
        run: make functional

  # tick-gate is the wall-clock gate the split moved out of nova-tools'
  # certification.yml: the dirty tick drive against a real store, every tick
  # held to MaxTickWall (NOVA_SPRINT_GATE_STORE=1 asserts it). It is a bench's
  # job, not a per-PR gate: run it by hand (workflow_dispatch) on a runner with
  # redis-server and enough cores to meet the one-second tick bound.
  tick-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: tick gate
        env:
          NOVA_CI: "1"
          NOVA_SPRINT_GATE_STORE: "1"
        run: go test -tags functional -run TestTheDirtyTickDriveOnAStore -count=1 -timeout 600s ./cmd/nova-sprint
