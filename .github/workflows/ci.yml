# CI for nova-sprint v2: lint, the unit tier, the functional tier and TLC.
# Each step is one plain command; docs/TESTING.md lists the same commands to run
# by hand. Pull requests run on the self-hosted runners, and only for branches
# of this repository: a fork's code never runs on them.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 10
    steps:
      - &clean
        name: clean the reused workspace
        shell: bash
        run: |
          [ -d "${GITHUB_WORKSPACE:?}/.git" ] || exit 0
          git -C "$GITHUB_WORKSPACE" reset -q --hard && git -C "$GITHUB_WORKSPACE" clean -ffdxq ||
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - &go
        name: use the installed Go toolchain
        shell: bash
        run: |
          want=go$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)
          newest=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true)
          onpath=$(dirname "$(command -v go 2>/dev/null || echo /none/go)")
          for d in "$HOME/sdk/$want/bin" "$newest" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin "$onpath"; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; "$d/go" version; exit 0; }
          done
          echo "no Go toolchain on this runner" >&2; exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: build (stamped with git describe, as the Makefile does)
        run: go build -ldflags "-X main.binaryVersion=$(git describe --always --dirty --tags --match 'v[0-9]*')" ./...
      - name: vet
        run: go vet ./...
      # The silent-error lint (tools/silentlint): no error dropped in an err
      # branch, no refusal re-wrapped, no unlisted `_ =` discard, no bare exit.
      - name: silentlint (every layer, bottom up)
        run: go run ./tools/silentlint store card steps edge policy roster run verbs cmd dash tools

  # The card package's race run takes about 556 s on vision (2026-11-06), near
  # go test's default 10-minute per-package bound: each package gets 20 minutes
  # (about twice the slowest), the job 30 (packages build and run in parallel).
  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 30
    steps:
      - *clean
      - *checkout
      - *go
      - name: unit tests (everything but the functional tests)
        run: go test -count=1 -race -timeout 20m -skip Functional ./...

  functional:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 20
    steps:
      - *clean
      - *checkout
      - *go
      - name: postgres on PATH
        shell: bash
        run: |
          command -v initdb >/dev/null || ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq postgresql; }
          for d in /usr/lib/postgresql/*/bin; do [ -x "$d/initdb" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: initdb is present (a missing one fails the job, it does not skip)
        run: command -v initdb
      # Each functional test starts its own PostgreSQL. This runner is Linux, so
      # the default parallelism is fine; on macOS run with -parallel 4, because
      # its System V shared memory limits run out (docs/TESTING.md).
      - name: functional tests
        run: go test -count=1 -race -run Functional ./...

  # Trace validation (tla/README.md, "Trace validation"): the store's walks
  # (the Fake, and PostgreSQL), the card walk and the policy walk on their
  # fixed seeds, each trace checked by TLC against its model, and the
  # breakers refused. Layer 6 (tla/CHECK-LAYER6-TRACES.md): the Run fixtures
  # (run.Ticker and run.Pusher on three seeds and the stop cycle) and the
  # Setup fixtures (setup, handoff, choices, the 64 installer walks).
  trace:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 60
    steps:
      - *clean
      - *checkout
      - *go
      - name: postgres on PATH
        shell: bash
        run: |
          command -v initdb >/dev/null || ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq postgresql; }
          for d in /usr/lib/postgresql/*/bin; do [ -x "$d/initdb" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: Java is present for Layer 6 traces
        run: test -x "$HOME/sdk/bin/java" || command -v java
      - name: Emit and check fixed-seed Layer 6 traces
        run: nova-reserve run --slots 4 --wait 15m --why "Layer 6 trace CI" -- nice -n 19 python3 tla/check-layer6-traces.py --mode all --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/layer6-traces-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        env:
          GOMAXPROCS: "4"
      - name: Retain Layer 6 trace evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: layer6-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/layer6-traces-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: the walks write their traces, TLC checks each (a missing initdb fails the job)
        run: bash tla/make-traces.sh check
        env:
          NOVA_TRACE_PG: "1"

  tlc:
    # The studio (32 cores, 512 GB): the 200+ TLC runs were OOM-killed on a 30 GB bench
    # (Glenn, 2026-11-06: "if you are out of memory, do it on the studio").
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, tlc]
    timeout-minutes: 180
    steps:
      - *clean
      - *checkout
      - name: TLC on Store (must pass), the witnesses and the reach checks (must be violated)
        run: bash tla/ci-tlc.sh

