# CI for nova-sprint v2, per commit: lint, the unit tier, the functional tier
# and the short trace check. Every job finishes inside 2 minutes (the fleet's
# runners stop a per-commit job past that). The full TLC, the long walks and
# the Layer 6 traces run in nightly.yml. Each step is one plain command;
# docs/TESTING.md lists the same commands to run by hand. Pull requests run on the self-hosted runners, and only for branches
# of this repository: a fork's code never runs on them.

name: ci

on:
  push:
    branches: [ main, 'sprint/*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request: a new push to it cancels the run it supersedes.
  # A push (main, sprint/*) or a dispatch always finishes its run: each has a
  # group of its own (its run id), so it is never cancelled, nor dropped while
  # it waits behind another, and a main commit's CI confirms that commit.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 2
    steps:
      - &clean
        name: clean the reused workspace
        shell: bash
        run: |
          [ -d "${GITHUB_WORKSPACE:?}/.git" ] || exit 0
          git -C "$GITHUB_WORKSPACE" reset -q --hard && git -C "$GITHUB_WORKSPACE" clean -ffdxq ||
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - &go
        name: use the installed Go toolchain
        shell: bash
        run: |
          want=go$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)
          newest=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true)
          onpath=$(dirname "$(command -v go 2>/dev/null || echo /none/go)")
          for d in "$HOME/sdk/$want/bin" "$newest" "$HOME/go/bin" /usr/local/go/bin /opt/homebrew/bin "$onpath"; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; "$d/go" version; exit 0; }
          done
          echo "no Go toolchain on this runner" >&2; exit 1
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: build (stamped with git describe, as the Makefile does)
        run: go build -ldflags "-X main.binaryVersion=$(git describe --always --dirty --tags --match 'v[0-9]*')" ./...
      - name: vet
        run: go vet ./...
      # The silent-error lint (cmd/silentlint): no error dropped in an err
      # branch, no refusal re-wrapped, no unlisted `_ =` discard, no bare exit.
      - name: silentlint (every layer, bottom up)
        run: go run ./cmd/silentlint modules/store modules/card modules/steps modules/edge modules/policy modules/roster modules/run modules/verbs cmd modules/dash
      - name: every test is parallel; no unit test uses real time, sleep, network or processes
        run: go run ./cmd/unitlint
      - name: every test runs in exactly one unit or functional shard
        run: go run ./cmd/cishards

  # staticcheck and deadcode at the versions go.mod pins as tools, as nova-tools
  # runs them; their own job so lint stays inside 2 minutes. deadcode -test
  # reports functions nothing reaches from a main or a test; a test file's
  # fakes (forge.Fake's whole interface) are seams, so its lines are not counted.
  # dash's Cache.SetRoster is not dead but unwired: the store's own board
  # (dash without --pull) never sets a roster, so every row shows at width 0.
  # It is kept, and listed here, until that is wired.
  staticcheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 2
    steps:
      - *clean
      - *checkout
      - *go
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: deadcode (no unreached function outside a test file)
        shell: bash
        run: |
          out=$(go tool deadcode -test ./...)
          out=$(printf '%s\n' "$out" | grep -v -e '_test\.go:' -e 'unreachable func: Cache\.SetRoster$' || true)
          test -z "$out" || { printf '%s\n' "$out"; exit 1; }

  # -short: the random walks and sweeps take fewer seeds or steps (the nightly
  # runs them all). The test binaries run with an empty PATH and a HOME that
  # does not exist (go test -exec env), so a unit test that starts a program
  # (nova-tools, git, a shell, a harness), by name or from ~/.local/bin, fails
  # here instead of passing on a bench that has it.
  #
  # The unit and functional jobs are matrices of shards, each on its own
  # runner: one job for every test ran past 2 minutes on a loaded runner (the
  # tests are CPU bound). A shard runs `go test -run RUN -skip SKIP PKGS`;
  # the rest shard runs every package outside its others list. A long test
  # is split by its subtests, with one complement shard that runs the test
  # and skips the split-off subtests, so a new or renamed subtest still runs.
  # cmd/cishards (in lint) checks that each test runs in exactly one shard.
  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: card-sweep, pkgs: ./modules/card, run: '^TestBreakSweep$' }
          - { shard: card-triples-drop, pkgs: ./modules/card, run: '^TestBreakSweepTriples$/^drop$' }
          - { shard: card-triples-inflight, pkgs: ./modules/card, run: '^TestBreakSweepTriples$/^inflight$' }
          - { shard: card-triples-rest, pkgs: ./modules/card, run: '^TestBreakSweepTriples$', skip: '^TestBreakSweepTriples$/(^drop$|^inflight$)' }
          - { shard: card-walks-a, pkgs: ./modules/card, run: '^(TestColdWalk|TestCold2Walk|TestColdread3Walk)$' }
          - { shard: card-walks-b, pkgs: ./modules/card, run: '^(TestColdread4Walk|TestColdread5Walk)$' }
          - { shard: card-rest, pkgs: ./modules/card, skip: 'Functional|^(TestBreakSweep|TestBreakSweepTriples|TestColdWalk|TestCold2Walk|TestColdread3Walk|TestColdread4Walk|TestColdread5Walk)$' }
          - { shard: steps-walk-even, pkgs: ./modules/steps, run: '^TestWalk$/[02468]$' }
          - { shard: steps-walk-rest, pkgs: ./modules/steps, run: '^TestWalk$', skip: '^TestWalk$/([02468]$)' }
          - { shard: steps-rest, pkgs: ./modules/steps, skip: 'Functional|^TestWalk$' }
          - { shard: rest, pkgs: rest, others: ./modules/card ./modules/steps, skip: Functional }
    name: unit (${{ matrix.shard }})
    steps:
      - *clean
      - *checkout
      - *go
      - &pkgs
        name: the shard's packages
        shell: bash
        run: |
          pkgs="$PKGS"
          if [ "$pkgs" = rest ]; then pkgs=$(go list ./... | grep -vxF "$(go list $OTHERS)" | tr '\n' ' '); fi
          echo "PKGS=$pkgs" >> "$GITHUB_ENV"
        env:
          PKGS: ${{ matrix.pkgs }}
          OTHERS: ${{ matrix.others }}
      - name: unit tests (the shard's; never the functional tests)
        run: go test -count=1 -race -short -timeout 100s -run "$RUN" -skip "$SKIP" -exec "env PATH=/nonexistent HOME=/nonexistent" $PKGS
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}

  functional:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 2
    # Shards as the unit job's: every functional test starts its own
    # PostgreSQL, so the three longest packages have a shard each, and store,
    # the longest, two (its tests split by name).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: cmd, pkgs: ./cmd/..., run: Functional }
          - { shard: store-a, pkgs: ./modules/store, run: '^TestFunctional[A-L]' }
          - { shard: store-rest, pkgs: ./modules/store, run: Functional, skip: '^TestFunctional[A-L]' }
          - { shard: verbs, pkgs: ./modules/verbs, run: Functional }
          - { shard: rest, pkgs: rest, others: ./cmd/... ./modules/store ./modules/verbs, run: Functional }
    name: functional (${{ matrix.shard }})
    steps:
      - *clean
      - *checkout
      - *go
      - name: postgres on PATH
        shell: bash
        run: |
          command -v initdb >/dev/null || ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq postgresql; }
          for d in /usr/lib/postgresql/*/bin; do [ -x "$d/initdb" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: initdb is present (a missing one fails the job, it does not skip)
        run: command -v initdb
      # Each functional test starts its own PostgreSQL. This runner is Linux, so
      # the default parallelism is fine; on macOS run with -parallel 4, because
      # its System V shared memory limits run out (docs/TESTING.md).
      # The roster test reads nova-config's schema.sql from the nova-tools
      # version go.mod links (the test checks its sha256).
      - name: the linked nova-config schema for the roster test
        shell: bash
        run: |
          go mod download github.com/mas-bandwidth/nova-tools/v2
          echo "NOVA_CONFIG_SCHEMA_FILE=$(go list -m -f '{{.Dir}}' github.com/mas-bandwidth/nova-tools/v2)/config/schema.sql" >> "$GITHUB_ENV"
      - *pkgs
      # NOVA_FUNCTIONAL=1 runs the tests that start their own PostgreSQL behind
      # that gate. Under CI a missing tool a functional test needs (redis-server,
      # nova-bus, pg_ctl, pg_dump, go) fails the test, it does not skip.
      - name: functional tests (the shard's)
        run: go test -count=1 -race -timeout 100s -run "$RUN" -skip "$SKIP" $PKGS
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
          NOVA_FUNCTIONAL: "1"


  # Trace validation (tla/README.md, "Trace validation"), short: the store's
  # walks (the Fake, and PostgreSQL) at 150 steps, the card, policy, steps,
  # land-edge and runner walks on their fixed seeds, each trace checked by TLC
  # against its model, and the breakers refused. The 500-step walks, the
  # Layer 6 traces and the full TLC run in nightly.yml.
  trace:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 2
    # One job per model group, each on its own runner: the whole set on one
    # runner overran the 2-minute rule under fleet load, and so did the steps
    # traces alone (101-132 s), so they are split by scenario and fixtures.
    strategy:
      fail-fast: false
      matrix:
        group: [store, card, policy, steps-pre, steps-deal, steps-land, steps-burst, steps-fixtures, edge, hook]
    name: trace (${{ matrix.group }})
    steps:
      - *clean
      - *checkout
      - *go
      - name: postgres on PATH
        shell: bash
        run: |
          command -v initdb >/dev/null || ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || { sudo -n apt-get update -qq && sudo -n apt-get install -y -qq postgresql; }
          for d in /usr/lib/postgresql/*/bin; do [ -x "$d/initdb" ] && echo "$d" >> "$GITHUB_PATH"; done
          true
      - name: the walks write their traces, TLC checks each (a missing initdb fails the job)
        run: bash tla/make-traces.sh check ${{ matrix.group }}
        env:
          NOVA_TRACE_PG: "1"
          GOFLAGS: -short
