# Release: on a tag vX.Y.Z, build nova-sprint for every os/arch, write SHA256SUMS, and attach them to
# the GitHub release. The fleet installs with `nova-sprint install --version vX.Y.Z` (the TSV row in
# versions.tsv names it), which downloads the asset for its own os/arch and verifies it here.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, linux, x64, bench]
    steps:
      - uses: actions/checkout@v4
      - name: build every os/arch
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$v" -o "dist/nova-sprint$ext" ./cmd/nova-sprint
            tar -C dist -czf "dist/nova-sprint_${v}_${os}_${arch}.tar.gz" "nova-sprint$ext"
            rm "dist/nova-sprint$ext"
          done
          (cd dist && sha256sum nova-sprint_* > SHA256SUMS)
          ls -la dist
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "nova-sprint $v" --notes "nova-sprint $v. Install: nova-sprint install --version $v (or nova-update apply --file versions.tsv nova-sprint --version $v). Verify against SHA256SUMS."
          gh release upload "$v" dist/nova-sprint_* dist/SHA256SUMS --clobber
