# Release: a pushed tag vX.Y.Z builds every command under cmd/ for every platform, writes one
# SHA256SUMS and creates the GitHub release. Assets are named <command>_<tag>_<os>_<arch>[.exe],
# the scheme nova-tools' release uses and `nova-fleet install --repo mas-bandwidth/nova-sprint
# --tag vX.Y.Z <host>...` reads (fleet/roles/nova-tools-install verifies each digest against
# SHA256SUMS). The only credential is the workflow's GITHUB_TOKEN.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: [self-hosted, linux, x64, bench]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: use the installed Go toolchain
        shell: bash
        run: |
          want=go$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)
          newest=$(ls -d "$HOME"/sdk/go*/bin 2>/dev/null | sort -V | tail -1 || true)
          onpath=$(dirname "$(command -v go 2>/dev/null || echo /none/go)")
          for d in "$HOME/sdk/$want/bin" "$newest" "$HOME/go/bin" /usr/local/go/bin "$onpath"; do
            [ -n "$d" ] && [ -x "$d/go" ] && { echo "$d" >> "$GITHUB_PATH"; "$d/go" version; exit 0; }
          done
          echo "no Go toolchain on this runner" >&2; exit 1
      - name: build every command for every platform
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in cmd/*/; do
            cmd=$(basename "$dir")
            # the version chip: main.version for a main that declares it, dash.Version for the dashboard
            flags="-s -w -X github.com/mas-bandwidth/nova-sprint/dash.Version=$TAG"
            if grep -q '^var version ' "$dir/main.go"; then flags="$flags -X main.version=$TAG"; fi
            pids=()
            for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
              os=${target%/*}; arch=${target#*/}
              ext=""; [ "$os" = windows ] && ext=".exe"
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" \
                -o "dist/${cmd}_${TAG}_${os}_${arch}${ext}" "./$dir" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
          done
          ls dist | wc -l
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum nova-* > SHA256SUMS
          cat SHA256SUMS
      - name: create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --title "nova-sprint $TAG" --generate-notes --verify-tag
