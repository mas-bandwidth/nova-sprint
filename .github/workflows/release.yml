# Release: a pushed tag vX.Y.Z builds every command under cmd/ for every platform, writes one
# SHA256SUMS and creates the GitHub release. Assets are named <command>_<tag>_<os>_<arch>[.exe],
# the scheme nova-tools' release uses and `nova-fleet install --repo mas-bandwidth/nova-sprint
# --tag vX.Y.Z <host>...` reads (fleet/roles/nova-tools-install verifies each digest against
# SHA256SUMS). The only credential is the workflow's GITHUB_TOKEN.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  release:
    # GitHub's own runner, as nova-tools' release: it has gh and setup-go; the fleet's runners
    # carry neither by design (v2.0.5's first release run failed on a bench with "gh: command not found")
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: build every command for every platform
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in cmd/*/; do
            cmd=$(basename "$dir")
            # the version: main.binaryVersion (nova-sprint's version verb, and what a
            # backup records) and dash.Version for the dashboard; -X on a main
            # without the variable is a no-op
            flags="-s -w -X main.binaryVersion=$TAG -X github.com/mas-bandwidth/nova-sprint/dash.Version=$TAG"
            pids=()
            for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
              os=${target%/*}; arch=${target#*/}
              ext=""; [ "$os" = windows ] && ext=".exe"
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" \
                -o "dist/${cmd}_${TAG}_${os}_${arch}${ext}" "./$dir" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do wait "$pid"; done
          done
          ls dist | wc -l
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum nova-* > SHA256SUMS
          cat SHA256SUMS
      - name: create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --title "nova-sprint $TAG" --generate-notes --verify-tag
